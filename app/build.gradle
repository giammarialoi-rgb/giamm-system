//file:noinspection GrDeprecatedAPIUsage
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giammaria.system'
    //noinspection GrDeprecatedAPIUsage
    compileSdk 37

    defaultConfig {
        applicationId "com.giammaria.system"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The production endpoint is public; it can be replaced at build time
        // with -PcoachApiUrl=https://another-host.example.
        def coachApiUrl = (project.findProperty("coachApiUrl") ?: "https://coach-api-gemini.onrender.com").replace('"', '\\"')
        buildConfigField "String", "COACH_API_URL", "\"${coachApiUrl}\""
        def googleWebClientId = (project.findProperty("googleWebClientId") ?: "").replace('"', '\\"')
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId}\""
    }

    dependencies {
        implementation "androidx.credentials:credentials:1.5.0"
        implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
        implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
        implementation "androidx.health.connect:connect-client:1.1.0"
        implementation "androidx.activity:activity:1.9.3"

        androidTestImplementation "androidx.test.ext:junit:1.1.5"
        androidTestImplementation "androidx.test:runner:1.5.2"
        androidTestImplementation "androidx.test:rules:1.5.0"
        androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    }

    buildFeatures {
        buildConfig true
    }
}

tasks.register('syncWebApp', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'sync_web_assets.mjs'
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncWebApp' }
}
