<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>كلمة مرور جديدة - Nurvan</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="legal.css">
</head>
<body>
<main>
  <header class="brand"><img src="nurvan_app_icon.png" alt="Nurvan"><span>NURVAN</span></header>
  <h1>اختر كلمة مرور جديدة</h1>
  <form id="reset-form" class="acct-form" hidden>
    <label for="reset-pw">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
    <input id="reset-pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="reset-pw2">أعد كتابة كلمة المرور الجديدة</label>
    <input id="reset-pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="reset-submit">احفظ كلمة المرور الجديدة</button>
  </form>
  <p id="acct-status" class="muted"></p>
  <p id="acct-next" hidden>تم. ارجع إلى تطبيق Nurvan وسجّل الدخول بكلمة المرور الجديدة: فقد جرى تسجيل الخروج من الأجهزة الأخرى.</p>
  <p><a id="acct-open" href="/" hidden>افتح Nurvan</a></p>
  <div id="reset-nolink" hidden>
    <p>هذا الرابط غير مكتمل. لإعادة تعيين كلمة المرور افتح Nurvan، واضغط على <strong>نسيت كلمة المرور</strong> واتبع التعليمات: ستصلك رسالة بريد إلكتروني برمز ورابط جديدين.</p>
  </div>
</main>
<script src="account-pages.js"></script>
</body>
</html>
