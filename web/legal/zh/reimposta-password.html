<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>新密码 - Nurvan</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="legal.css">
</head>
<body>
<main>
  <header class="brand"><img src="nurvan_app_icon.png" alt="Nurvan"><span>NURVAN</span></header>
  <h1>设置新密码</h1>
  <form id="reset-form" class="acct-form" hidden>
    <label for="reset-pw">新密码（至少 8 个字符）</label>
    <input id="reset-pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="reset-pw2">再次输入新密码</label>
    <input id="reset-pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="reset-submit">保存新密码</button>
  </form>
  <p id="acct-status" class="muted"></p>
  <p id="acct-next" hidden>完成。请返回 Nurvan 应用，使用新密码登录：其他设备已被退出登录。</p>
  <p><a id="acct-open" href="/" hidden>打开 Nurvan</a></p>
  <div id="reset-nolink" hidden>
    <p>此链接不完整。要重置密码，请打开 Nurvan，点按<strong>忘记密码</strong>并按照说明操作：您将收到一封包含新验证码和新链接的电子邮件。</p>
  </div>
</main>
<script src="account-pages.js"></script>
</body>
</html>
