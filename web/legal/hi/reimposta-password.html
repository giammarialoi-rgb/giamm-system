<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>नया पासवर्ड - Nurvan</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="legal.css">
</head>
<body>
<main>
  <header class="brand"><img src="nurvan_app_icon.png" alt="Nurvan"><span>NURVAN</span></header>
  <h1>नया पासवर्ड चुनें</h1>
  <form id="reset-form" class="acct-form" hidden>
    <label for="reset-pw">नया पासवर्ड (कम से कम 8 अक्षर)</label>
    <input id="reset-pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="reset-pw2">नया पासवर्ड दोबारा लिखें</label>
    <input id="reset-pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="reset-submit">नया पासवर्ड सहेजें</button>
  </form>
  <p id="acct-status" class="muted"></p>
  <p id="acct-next" hidden>हो गया। Nurvan ऐप में लौटें और नए पासवर्ड से लॉग इन करें: अन्य उपकरणों से लॉग आउट कर दिया गया है।</p>
  <p><a id="acct-open" href="/" hidden>Nurvan खोलें</a></p>
  <div id="reset-nolink" hidden>
    <p>यह लिंक पूरा नहीं है। पासवर्ड रीसेट करने के लिए Nurvan खोलें, <strong>पासवर्ड भूल गए</strong> पर टैप करें और निर्देशों का पालन करें: आपको एक नए कोड और नए लिंक वाला ईमेल मिलेगा।</p>
  </div>
</main>
<script src="account-pages.js"></script>
</body>
</html>
