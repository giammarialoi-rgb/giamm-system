<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Новый пароль - Nurvan</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="legal.css">
</head>
<body>
<main>
  <header class="brand"><img src="nurvan_app_icon.png" alt="Nurvan"><span>NURVAN</span></header>
  <h1>Выбери новый пароль</h1>
  <form id="reset-form" class="acct-form" hidden>
    <label for="reset-pw">Новый пароль (не менее 8 символов)</label>
    <input id="reset-pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="reset-pw2">Повтори новый пароль</label>
    <input id="reset-pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="reset-submit">Сохранить новый пароль</button>
  </form>
  <p id="acct-status" class="muted"></p>
  <p id="acct-next" hidden>Готово. Вернись в приложение Nurvan и войди с новым паролем: на других устройствах выход выполнен.</p>
  <p><a id="acct-open" href="/" hidden>Открыть Nurvan</a></p>
  <div id="reset-nolink" hidden>
    <p>Эта ссылка неполная. Чтобы сбросить пароль, открой Nurvan, нажми <strong>Забыли пароль</strong> и следуй инструкциям: тебе придёт письмо с новым кодом и новой ссылкой.</p>
  </div>
</main>
<script src="account-pages.js"></script>
</body>
</html>
