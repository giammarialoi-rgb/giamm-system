<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="Wachstum von Rectus femoris und Vastus lateralis bei 40 oder 90 Grad Hüftbeugung">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,'Noto Sans','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans SC',sans-serif;fill:#f0f0f0}
.ttl{font-size:23px;font-weight:700}
.sub{font-size:14px;fill:#a0a0a0}
.ax{font-size:13px;fill:#a0a0a0}
.axl{font-size:13px;fill:#a0a0a0;font-weight:600}
.cat{font-size:15px;font-weight:600;fill:#f0f0f0}
.val{font-size:14px;font-weight:700}
.leg{font-size:13px;fill:#f0f0f0}
.src{font-size:11.5px;fill:#a0a0a0}
</style>
<rect width="920" height="560" fill="#0c0c0c"/>
<text class="ttl" x="38" y="40">Zurückgelehnt oder aufrecht am Beinstrecker</text>
<text class="sub" x="38" y="64">Veränderung der Muskeldicke in 10 Wochen, 22 untrainierte Männer</text>
<line x1="38" y1="78" x2="882" y2="78" stroke="#aa8a2e" stroke-width="1" opacity="0.5"/>
<line x1="300.0" y1="90" x2="300.0" y2="414.0" stroke="#2a2a2a" stroke-width="1"/>
<text class="ax" x="300.0" y="436.0" text-anchor="middle">0</text>
<line x1="456.8" y1="90" x2="456.8" y2="414.0" stroke="#2a2a2a" stroke-width="1"/>
<text class="ax" x="456.8" y="436.0" text-anchor="middle">5%</text>
<line x1="613.5" y1="90" x2="613.5" y2="414.0" stroke="#2a2a2a" stroke-width="1"/>
<text class="ax" x="613.5" y="436.0" text-anchor="middle">10%</text>
<line x1="770.3" y1="90" x2="770.3" y2="414.0" stroke="#2a2a2a" stroke-width="1"/>
<text class="ax" x="770.3" y="436.0" text-anchor="middle">15%</text>
<line x1="300.0" y1="90" x2="300.0" y2="414.0" stroke="#a0a0a0" stroke-width="1.2"/>
<text class="cat" x="286" y="134.0" text-anchor="end">Rectus femoris (proximal)</text>
<rect x="300.0" y="104.0" width="388.8" height="22" fill="#d4af37" rx="3"/>
<text class="val" x="696.8" y="120.5" fill="#d4af37">+12,4%</text>
<rect x="300.0" y="130.0" width="144.2" height="22" fill="#8a8a8a" rx="3"/>
<text class="val" x="452.2" y="146.5" fill="#8a8a8a">+4,6%</text>
<text class="cat" x="286" y="214.0" text-anchor="end">Rectus femoris (distal)</text>
<rect x="300.0" y="184.0" width="495.4" height="22" fill="#d4af37" rx="3"/>
<text class="val" x="803.4" y="200.5" fill="#d4af37">+15,8%</text>
<rect x="300.0" y="210.0" width="341.7" height="22" fill="#8a8a8a" rx="3"/>
<text class="val" x="649.7" y="226.5" fill="#8a8a8a">+10,9%</text>
<text class="cat" x="286" y="294.0" text-anchor="end">Vastus lateralis (proximal)</text>
<rect x="300.0" y="264.0" width="338.6" height="22" fill="#d4af37" rx="3"/>
<text class="val" x="646.6" y="280.5" fill="#d4af37">+10,8%</text>
<rect x="300.0" y="290.0" width="304.1" height="22" fill="#8a8a8a" rx="3"/>
<text class="val" x="612.1" y="306.5" fill="#8a8a8a">+9,7%</text>
<text class="cat" x="286" y="374.0" text-anchor="end">Vastus lateralis (distal)</text>
<rect x="300.0" y="344.0" width="310.4" height="22" fill="#d4af37" rx="3"/>
<text class="val" x="618.4" y="360.5" fill="#d4af37">+9,9%</text>
<rect x="300.0" y="370.0" width="369.9" height="22" fill="#8a8a8a" rx="3"/>
<text class="val" x="677.9" y="386.5" fill="#8a8a8a">+11,8%</text>
<text class="axl" x="590" y="466.0" text-anchor="middle">Veränderung der Muskeldicke (%)</text>
<rect x="38" y="487.0" width="13" height="13" fill="#d4af37" rx="2"/>
<text class="leg" x="58" y="498.0">Hüfte bei 40° (zurückgelehnt)</text>
<rect x="440" y="487.0" width="13" height="13" fill="#8a8a8a" rx="2"/>
<text class="leg" x="460" y="498.0">Hüfte bei 90° (aufrecht)</text>
<text class="src" x="38" y="528.0">Larsen et al., 2025 (PMID 39699974); Prozentwerte aus dem SportRxiv-Preprint 10.51224/SRXIV.407. Originalgrafik von Nurvan.</text>
</svg>