<text x="40" y="384" fill="#a0a0a0" font-size="12.5" text-anchor="start">来源：Stoffel et al., 2017, Lancet Haematology (PMID 29032957)</text>
<text x="40" y="404" fill="#aa8a2e" font-size="12" font-weight="600" text-anchor="start">NURVAN</text>
