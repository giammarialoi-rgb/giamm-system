<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="880" height="420" fill="#0c0c0c"/>
<text x="40" y="48" fill="#f0f0f0" font-size="26" font-weight="700" text-anchor="start">आयरन: वही 60 mg की 14 खुराकें</text>
<text x="40" y="78" fill="#a0a0a0" font-size="15" text-anchor="start">कुल अवशोषित आयरन, कम भंडार वाली महिलाएँ (mg)</text>
<text x="40" y="146" fill="#f0f0f0" font-size="19" font-weight="600">लगातार दिन</text>
<text x="40" y="168" fill="#a0a0a0" font-size="13">खुराक का 16.3% अवशोषित</text>
<rect x="300" y="130" width="327" height="40" rx="5" fill="#aa8a2e"/>
<text x="641" y="158" fill="#f3e5ab" font-size="24" font-weight="700">131.0 mg</text>
<text x="40" y="256" fill="#f0f0f0" font-size="19" font-weight="600">एक दिन छोड़कर</text>
<text x="40" y="278" fill="#a0a0a0" font-size="13">खुराक का 21.8% अवशोषित</text>
<rect x="300" y="240" width="438" height="40" rx="5" fill="#d4af37"/>
<text x="752" y="268" fill="#f3e5ab" font-size="24" font-weight="700">175.3 mg</text>
<line x1="40" y1="358" x2="840" y2="358" stroke="#2a2a2a" stroke-width="1"/>
<text x="40" y="384" fill="#a0a0a0" font-size="12.5" text-anchor="start">स्रोत: Stoffel et al., 2017, Lancet Haematology (PMID 29032957)</text>
<text x="40" y="404" fill="#aa8a2e" font-size="12" font-weight="600" text-anchor="start">NURVAN</text>
</svg>