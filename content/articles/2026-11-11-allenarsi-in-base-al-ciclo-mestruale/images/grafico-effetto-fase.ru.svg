<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Насколько фаза цикла влияет на результат">
<rect width="900" height="470" fill="#0c0c0c"/>
<text x="40" y="46" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700">Насколько фаза цикла влияет на результат</text>
<rect x="547.3" y="92" width="312.7" height="200" fill="#d4af37" opacity="0.07"/>
<line x1="547.3" y1="92" x2="547.3" y2="292" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
<text x="555.3" y="108" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13">ничтожный эффект (|d| &lt; 0,2)</text>
<line x1="742.7" y1="118" x2="742.7" y2="292" stroke="#262626" stroke-width="1.5"/>
<text x="40" y="154" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start">Ранняя фолликулярная vs все остальные фазы</text>
<line x1="586.4" y1="176" x2="781.8" y2="176" stroke="#aa8a2e" stroke-width="3"/>
<line x1="586.4" y1="168" x2="586.4" y2="184" stroke="#aa8a2e" stroke-width="3"/>
<line x1="781.8" y1="168" x2="781.8" y2="184" stroke="#aa8a2e" stroke-width="3"/>
<circle cx="684.1" cy="176" r="7.5" fill="#d4af37"/>
<text x="40" y="182" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">d = -0,06 (-0,16 – 0,04)</text>
<text x="40" y="229" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start">Ранняя vs поздняя фолликулярная</text>
<line x1="488.6" y1="251" x2="713.4" y2="251" stroke="#aa8a2e" stroke-width="3"/>
<line x1="488.6" y1="243" x2="488.6" y2="259" stroke="#aa8a2e" stroke-width="3"/>
<line x1="713.4" y1="243" x2="713.4" y2="259" stroke="#aa8a2e" stroke-width="3"/>
<circle cx="605.9" cy="251" r="7.5" fill="#d4af37"/>
<text x="40" y="257" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">d = -0,14 (-0,26 – -0,03)</text>
<line x1="430" y1="312" x2="860" y2="312" stroke="#262626" stroke-width="1.5"/>
<line x1="449.5" y1="312" x2="449.5" y2="318" stroke="#262626" stroke-width="1.5"/>
<text x="449.5" y="336" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">-0,3</text>
<line x1="547.3" y1="312" x2="547.3" y2="318" stroke="#262626" stroke-width="1.5"/>
<text x="547.3" y="336" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">-0,2</text>
<line x1="645.0" y1="312" x2="645.0" y2="318" stroke="#262626" stroke-width="1.5"/>
<text x="645.0" y="336" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">-0,1</text>
<line x1="742.7" y1="312" x2="742.7" y2="318" stroke="#262626" stroke-width="1.5"/>
<text x="742.7" y="336" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">0,0</text>
<line x1="840.5" y1="312" x2="840.5" y2="318" stroke="#262626" stroke-width="1.5"/>
<text x="840.5" y="336" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">0,1</text>
<text x="645" y="366" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">размер эффекта (d) — отрицательные значения = результат хуже</text>
<text x="40" y="408" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">Источник: McNulty et al., 2020, Sports Medicine, сетевой метаанализ 78 исследований (PMID</text>
<text x="40" y="425" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">32661839). Значения и 95% интервалы взяты из абстракта.</text>
<text x="860" y="456" fill="#aa8a2e" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2" text-anchor="end">NURVAN</text>
</svg>
