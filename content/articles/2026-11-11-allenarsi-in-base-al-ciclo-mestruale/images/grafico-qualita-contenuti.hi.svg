<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="cycle syncing पर 160 TikTok वीडियो में क्या है">
<rect width="900" height="470" fill="#0c0c0c"/>
<text x="40" y="46" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700">cycle syncing पर 160 TikTok वीडियो में क्या है</text>
<text x="40" y="114" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start">तरीके के पक्ष में</text>
<rect x="430" y="97" width="382" height="22" fill="#262626"/>
<rect x="430" y="97" width="374.4" height="22" fill="#d4af37"/>
<text x="814" y="114" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">98%</text>
<text x="40" y="172" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start">वर्कआउट की योजना बताते हैं</text>
<rect x="430" y="155" width="382" height="22" fill="#262626"/>
<rect x="430" y="155" width="317.1" height="22" fill="#aa8a2e"/>
<text x="757" y="172" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">83%</text>
<text x="40" y="230" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start">किसी उत्पाद का प्रचार</text>
<rect x="430" y="213" width="382" height="22" fill="#262626"/>
<rect x="430" y="213" width="305.6" height="22" fill="#aa8a2e"/>
<text x="746" y="230" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">80%</text>
<text x="40" y="288" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start">स्वास्थ्य पेशेवरों द्वारा</text>
<rect x="430" y="271" width="382" height="22" fill="#262626"/>
<rect x="430" y="271" width="34.4" height="22" fill="#555555"/>
<text x="474" y="288" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">9%</text>
<line x1="430" y1="302" x2="812" y2="302" stroke="#262626" stroke-width="1.5"/>
<text x="430" y="320" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">0</text>
<text x="526" y="320" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">25</text>
<text x="621" y="320" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">50</text>
<text x="716" y="320" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">75</text>
<text x="812" y="320" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">100</text>
<text x="621" y="344" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">विश्लेषित वीडियो का % (n = 160; 1.89 करोड़ व्यूज़)</text>
<text x="40" y="408" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">स्रोत: Leupold et al., 2026, Sports Health (PMID 42725442)। प्रतिशत</text>
<text x="40" y="425" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">ऐब्स्ट्रैक्ट से।</text>
<text x="860" y="456" fill="#aa8a2e" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2" text-anchor="end">NURVAN</text>
</svg>
