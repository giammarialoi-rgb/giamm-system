<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="बार चार्ट: सामान्य वज़न वाली माँ वाले परिवारों में बच्चे के मोटापे का ऑड्स रेशियो सामान्य वज़न वाले पिता के साथ 1, अधिक वज़न वाले पिता के साथ 2.26, मोटापे वाले पिता के साथ 6.44 (Tomar et al. 2024)">
<rect width="600" height="250" fill="#0c0c0c"/>
<text x="16" y="28" font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#f0f0f0">पिता के वज़न के अनुसार बच्चे में मोटापे का जोखिम</text>
<text x="16" y="48" font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="12" fill="#a0a0a0">सामान्य वज़न वाली माँ वाले परिवार · ऑड्स रेशियो</text>
<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">
<line x1="262.0" y1="64" x2="262.0" y2="200" stroke="#262626"/>
<text x="262.0" y="216" text-anchor="middle">0</text>
<line x1="304.6" y1="64" x2="304.6" y2="200" stroke="#555"/>
<text x="304.6" y="216" text-anchor="middle">1</text>
<line x1="347.1" y1="64" x2="347.1" y2="200" stroke="#262626"/>
<text x="347.1" y="216" text-anchor="middle">2</text>
<line x1="389.7" y1="64" x2="389.7" y2="200" stroke="#262626"/>
<text x="389.7" y="216" text-anchor="middle">3</text>
<line x1="432.3" y1="64" x2="432.3" y2="200" stroke="#262626"/>
<text x="432.3" y="216" text-anchor="middle">4</text>
<line x1="474.9" y1="64" x2="474.9" y2="200" stroke="#262626"/>
<text x="474.9" y="216" text-anchor="middle">5</text>
<line x1="517.4" y1="64" x2="517.4" y2="200" stroke="#262626"/>
<text x="517.4" y="216" text-anchor="middle">6</text>
<line x1="560.0" y1="64" x2="560.0" y2="200" stroke="#262626"/>
