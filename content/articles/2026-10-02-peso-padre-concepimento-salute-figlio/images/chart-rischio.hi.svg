</g>
<g font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="13" fill="#f0f0f0">
<text x="16" y="95">सामान्य वज़न वाले पिता (संदर्भ)</text>
<rect x="262" y="78" width="42.6" height="24" rx="3" fill="#aa8a2e" opacity="0.55"/>
<text x="312.6" y="95" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#a0a0a0">1 · संदर्भ</text>
<text x="16" y="137">अधिक वज़न वाले पिता</text>
<rect x="262" y="120" width="96.2" height="24" rx="3" fill="#d4af37" opacity="1"/>
<text x="366.2" y="137" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#f3e5ab">2.26</text>
<text x="16" y="179">मोटापे वाले पिता</text>
<rect x="262" y="162" width="274.2" height="24" rx="3" fill="#d4af37" opacity="1"/>
<text x="544.2" y="179" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#f3e5ab">6.44</text>
<text x="262" y="238" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">ऑड्स रेशियो (सामान्य वज़न वाले पिता = 1)</text>
</g></svg>