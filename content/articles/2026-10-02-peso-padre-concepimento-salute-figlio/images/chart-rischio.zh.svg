<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="条形图：在母亲体重正常的家庭中，孩子肥胖的比值比：父亲体重正常为 1，父亲超重为 2.26，父亲肥胖为 6.44（Tomar et al. 2024）">
<rect width="600" height="250" fill="#0c0c0c"/>
<text x="16" y="28" font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#f0f0f0">按父亲体重划分的孩子肥胖风险</text>
<text x="16" y="48" font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="12" fill="#a0a0a0">母亲体重正常的家庭 · 比值比</text>
<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">
<line x1="262.0" y1="64" x2="262.0" y2="200" stroke="#262626"/>
<text x="262.0" y="216" text-anchor="middle">0</text>
<line x1="304.6" y1="64" x2="304.6" y2="200" stroke="#555"/>
<text x="304.6" y="216" text-anchor="middle">1</text>
<line x1="347.1" y1="64" x2="347.1" y2="200" stroke="#262626"/>
<text x="347.1" y="216" text-anchor="middle">2</text>
<line x1="389.7" y1="64" x2="389.7" y2="200" stroke="#262626"/>
<text x="389.7" y="216" text-anchor="middle">3</text>
<line x1="432.3" y1="64" x2="432.3" y2="200" stroke="#262626"/>
<text x="432.3" y="216" text-anchor="middle">4</text>
<line x1="474.9" y1="64" x2="474.9" y2="200" stroke="#262626"/>
<text x="474.9" y="216" text-anchor="middle">5</text>
<line x1="517.4" y1="64" x2="517.4" y2="200" stroke="#262626"/>
<text x="517.4" y="216" text-anchor="middle">6</text>
<line x1="560.0" y1="64" x2="560.0" y2="200" stroke="#262626"/>
<text x="560.0" y="216" text-anchor="middle">7</text>
</g>
<g font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="13" fill="#f0f0f0">
<text x="16" y="95">父亲体重正常（参照）</text>
<rect x="262" y="78" width="42.6" height="24" rx="3" fill="#aa8a2e" opacity="0.55"/>
<text x="312.6" y="95" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#a0a0a0">1 · 参照</text>
<text x="16" y="137">父亲超重</text>
<rect x="262" y="120" width="96.2" height="24" rx="3" fill="#d4af37" opacity="1"/>
<text x="366.2" y="137" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#f3e5ab">2.26</text>
<text x="16" y="179">父亲肥胖</text>
<rect x="262" y="162" width="274.2" height="24" rx="3" fill="#d4af37" opacity="1"/>
<text x="544.2" y="179" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#f3e5ab">6.44</text>
<text x="262" y="238" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">比值比（父亲体重正常 = 1）</text>
</g></svg>