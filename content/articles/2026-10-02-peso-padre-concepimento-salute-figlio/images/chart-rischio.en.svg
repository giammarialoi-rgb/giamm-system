<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Bar chart: odds ratio of child obesity 1 with a normal-weight father, 2.26 with an overweight father, 6.44 with an obese father, in families with a normal-weight mother (Tomar et al. 2024)">
