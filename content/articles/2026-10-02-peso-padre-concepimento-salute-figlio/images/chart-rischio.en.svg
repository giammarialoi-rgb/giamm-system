<text x="16" y="48" font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="12" fill="#a0a0a0">Families with a normal-weight mother · odds ratio</text>
