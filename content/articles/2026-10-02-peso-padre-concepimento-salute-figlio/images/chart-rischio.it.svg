<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Grafico a barre: odds ratio di obesità del figlio 1 con padre normopeso, 2,26 con padre in sovrappeso, 6,44 con padre obeso, in famiglie con madre normopeso (Tomar et al. 2024)">
