<text x="432.3" y="216" text-anchor="middle">4</text>
<line x1="474.9" y1="64" x2="474.9" y2="200" stroke="#262626"/>
<text x="474.9" y="216" text-anchor="middle">5</text>
<line x1="517.4" y1="64" x2="517.4" y2="200" stroke="#262626"/>
<text x="517.4" y="216" text-anchor="middle">6</text>
