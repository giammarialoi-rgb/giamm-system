<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="点图：8 周低热量饮食、减重 16.5 公斤后，精子浓度为基线的 1.49 倍（95% CI 1.18–1.88），精子总数为 1.41 倍（95% CI 1.07–1.87）（Andersen et al. 2022）">
