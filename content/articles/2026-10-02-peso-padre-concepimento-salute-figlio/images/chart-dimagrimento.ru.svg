<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="Точечная диаграмма: после 8 недель низкокалорийной диеты и потери 16,5 кг концентрация сперматозоидов ×1,49 (95% ДИ 1,18–1,88), общее количество ×1,41 (95% ДИ 1,07–1,87) (Andersen et al. 2022)">
<rect width="600" height="220" fill="#0c0c0c"/>
<text x="16" y="28" font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#f0f0f0">Сперматозоиды после снижения веса на 16,5 кг за 8 недель</text>
<text x="16" y="48" font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="12" fill="#a0a0a0">Изменение относительно исходного · 95% ДИ</text>
<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">
<line x1="200.0" y1="64" x2="200.0" y2="170" stroke="#262626"/>
<text x="200.0" y="186" text-anchor="middle">0,8</text>
<line x1="261.7" y1="64" x2="261.7" y2="170" stroke="#777" stroke-dasharray="4 3"/>
<text x="261.7" y="186" text-anchor="middle">1,0</text>
<line x1="323.3" y1="64" x2="323.3" y2="170" stroke="#262626"/>
<text x="323.3" y="186" text-anchor="middle">1,2</text>
<line x1="385.0" y1="64" x2="385.0" y2="170" stroke="#262626"/>
<text x="385.0" y="186" text-anchor="middle">1,4</text>
<line x1="446.7" y1="64" x2="446.7" y2="170" stroke="#262626"/>
<text x="446.7" y="186" text-anchor="middle">1,6</text>
<line x1="508.3" y1="64" x2="508.3" y2="170" stroke="#262626"/>
<text x="508.3" y="186" text-anchor="middle">1,8</text>
<line x1="570.0" y1="64" x2="570.0" y2="170" stroke="#262626"/>
<text x="570.0" y="186" text-anchor="middle">2,0</text>
<text x="265.7" y="76" font-size="10">до диеты = 1</text>
</g>
<g font-family="Bricolage Grotesque, system-ui, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans SC', sans-serif" font-size="13" fill="#f0f0f0">
<text x="16" y="109">Концентрация</text>
<line x1="317.2" y1="104" x2="533.0" y2="104" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
<circle cx="412.8" cy="104" r="7" fill="#d4af37"/>
<text x="412.8" y="92" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#f3e5ab">×1,49 (1,18–1,88)</text>
<text x="16" y="153">Общее количество</text>
<line x1="283.2" y1="148" x2="529.9" y2="148" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
<circle cx="388.1" cy="148" r="7" fill="#d4af37"/>
<text x="388.1" y="136" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#f3e5ab">×1,41 (1,07–1,87)</text>
<text x="200" y="208" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">во сколько раз относительно исходного</text>
</g></svg>