<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="c1t c1d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="c1t">पैर 20° बाहर घुमाना: असल में क्या बदलता है</title><desc id="c1d">पैर 20 डिग्री बाहर घुमाने पर समानांतर पैरों की तुलना में EMG बदलाव: बाइसेप्स फेमोरिस प्लस 35 प्रतिशत, मीडियल गैस्ट्रोक्नीमियस प्लस 70 प्रतिशत, बाकी छह मांसपेशियों में कोई सार्थक अंतर नहीं।</desc>
<rect width="800" height="500" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">पैर 20° बाहर घुमाना: असल में क्या बदलता है</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#a0a0a0">समानांतर पैरों की तुलना में EMG सक्रियता में बदलाव · सिर्फ़ नीचे जाने के चरण में · 80% 1RM</text>
