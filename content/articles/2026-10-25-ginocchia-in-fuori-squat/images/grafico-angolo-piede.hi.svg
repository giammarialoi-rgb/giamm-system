<text x="355" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f3e5ab">+35%</text>
<text x="355" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">बाइसेप्स फेमोरिस</text>
<rect x="470" y="175" width="110" height="245" fill="#d4af37"/>
<text x="525" y="163" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f3e5ab">+70%</text>
<text x="525" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">मीडियल गैस्ट्रोक्नीमियस</text>
<rect x="640" y="417" width="110" height="3" fill="#4a4a4a"/>
<text x="695" y="406" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#a0a0a0">0</text>
<text x="695" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">मापी गई 6 अन्य मांसपेशियाँ</text>
<text x="695" y="462" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#a0a0a0">कोई सार्थक अंतर नहीं</text>
<text x="40" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#a0a0a0">डेटा: Rolli et al., 2021, J Sports Med Phys Fitness (PMID 34498821), 8 सक्रिय पुरुष</text>
