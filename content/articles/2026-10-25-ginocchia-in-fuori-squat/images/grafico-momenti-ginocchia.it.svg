<title id="c2t">Bloccare le ginocchia dietro le punte</title><desc id="c2d">Momento al ginocchio 150 contro 117 newton metro e momento all'anca 28 contro 303 newton metro, ginocchia libere contro ginocchia bloccate dietro le punte.</desc>
