<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="c2t c2d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="c2t">不让膝盖超过脚尖</title><desc id="c2d">膝关节力矩150对117牛米，髋关节力矩28对303牛米，膝盖自由与膝盖受限于脚尖之后的对比。</desc>
<rect width="800" height="500" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">不让膝盖超过脚尖</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#a0a0a0">平行深蹲中的静态关节力矩 · 负荷等于体重</text>
<rect x="40" y="96" width="14" height="14" fill="#aa8a2e"/><text x="62" y="108" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">膝盖自由</text>
<rect x="330" y="96" width="14" height="14" fill="#d4af37"/><text x="352" y="108" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">膝盖受限</text>
<line x1="130" y1="420" x2="760" y2="420" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="130" y1="145" x2="130" y2="420" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="130" y1="340" x2="760" y2="340" stroke="#222" stroke-width="1"/>
<text x="120" y="344" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">100</text>
<line x1="130" y1="261" x2="760" y2="261" stroke="#222" stroke-width="1"/>
<text x="120" y="265" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">200</text>
<line x1="130" y1="181" x2="760" y2="181" stroke="#222" stroke-width="1"/>
<text x="120" y="185" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">300</text>
<text x="120" y="424" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">0</text>
<text x="120" y="135" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">N·m</text>
<rect x="220" y="300" width="105" height="120" fill="#aa8a2e"/>
<text x="272" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e5ab">150</text>
<rect x="340" y="327" width="105" height="93" fill="#d4af37"/>
<text x="392" y="317" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e5ab">117</text>
<text x="332" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#f0f0f0">膝关节</text>
<rect x="530" y="398" width="105" height="22" fill="#aa8a2e"/>
<text x="582" y="388" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e5ab">28</text>
<rect x="650" y="179" width="105" height="241" fill="#d4af37"/>
<text x="702" y="169" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e5ab">303</text>
<text x="642" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#f0f0f0">髋关节</text>
<text x="40" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#a0a0a0">数据：Fry 等，2003，J Strength Cond Res（PMID 14636100），7名训练者</text>
