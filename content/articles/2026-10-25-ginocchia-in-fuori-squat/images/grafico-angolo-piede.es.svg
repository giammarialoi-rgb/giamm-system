<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="c1t c1d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="c1t">Girar los pies 20°: qué cambia de verdad</title><desc id="c1d">Cambio de EMG con 20 grados de rotación externa del pie frente a pies paralelos: bíceps femoral más 35 por ciento, gastrocnemio medial más 70 por ciento, sin diferencias significativas en los otros seis músculos.</desc>
<rect width="800" height="500" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">Girar los pies 20°: qué cambia de verdad</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#a0a0a0">Cambio de la activación EMG frente a pies paralelos · solo fase de bajada · 80% 1RM</text>
<line x1="250" y1="420" x2="760" y2="420" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="250" y1="140" x2="250" y2="450" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="250" y1="350" x2="760" y2="350" stroke="#222" stroke-width="1"/>
<text x="240" y="354" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">+20%</text>
<line x1="250" y1="280" x2="760" y2="280" stroke="#222" stroke-width="1"/>
<text x="240" y="284" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">+40%</text>
<line x1="250" y1="210" x2="760" y2="210" stroke="#222" stroke-width="1"/>
<text x="240" y="214" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">+60%</text>
<line x1="250" y1="140" x2="760" y2="140" stroke="#222" stroke-width="1"/>
<text x="240" y="144" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">+80%</text>
<text x="240" y="424" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">0</text>
<rect x="300" y="298" width="110" height="122" fill="#aa8a2e"/>
<text x="355" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f3e5ab">+35%</text>
<text x="355" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">Bíceps femoral</text>
<rect x="470" y="175" width="110" height="245" fill="#d4af37"/>
<text x="525" y="163" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f3e5ab">+70%</text>
<text x="525" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">Gastrocnemio medial</text>
<rect x="640" y="417" width="110" height="3" fill="#4a4a4a"/>
<text x="695" y="406" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#a0a0a0">0</text>
<text x="695" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f0f0f0">Otros 6 músculos medidos</text>
<text x="695" y="462" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#a0a0a0">sin diferencia significativa</text>
<text x="40" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#a0a0a0">Datos: Rolli et al., 2021, J Sports Med Phys Fitness (PMID 34498821), 8 hombres activos</text>
</svg>