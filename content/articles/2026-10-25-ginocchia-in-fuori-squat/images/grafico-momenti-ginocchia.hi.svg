<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="c2t c2d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="c2t">घुटनों को पंजों के पीछे रोकना</title><desc id="c2d">घुटने का टॉर्क 150 बनाम 117 न्यूटन मीटर और कूल्हे का टॉर्क 28 बनाम 303 न्यूटन मीटर, घुटने मुक्त बनाम घुटने पंजों के पीछे रोके हुए।</desc>
<rect width="800" height="500" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">घुटनों को पंजों के पीछे रोकना</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#a0a0a0">पैरलल स्क्वाट में स्थैतिक जोड़ टॉर्क · भार शरीर के वज़न के बराबर</text>
