<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="c1t c1d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="c1t">Füße 20° nach außen: was sich wirklich ändert</title><desc id="c1d">EMG-Veränderung bei 20 Grad Fußaußenrotation gegenüber parallelen Füßen: Bizeps femoris plus 35 Prozent, medialer Gastrocnemius plus 70 Prozent, kein signifikanter Unterschied bei den sechs anderen Muskeln.</desc>
<rect width="800" height="500" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">Füße 20° nach außen: was sich wirklich ändert</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#a0a0a0">Veränderung der EMG-Aktivität gegenüber parallelen Füßen · nur Abwärtsphase · 80% 1RM</text>
