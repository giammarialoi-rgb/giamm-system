<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="c1t c1d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="c1t">تدوير القدمين 20 درجة: ما الذي يتغير فعلاً</title><desc id="c1d">تغيّر النشاط الكهربائي عند تدوير القدم 20 درجة مقارنة بالوضع المتوازي: العضلة ذات الرأسين الفخذية زائد 35 بالمئة، التوأمية الإنسية زائد 70 بالمئة، ولا فروق ذات دلالة في العضلات الست الأخرى.</desc>
<rect width="800" height="500" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">تدوير القدمين 20 درجة: ما الذي يتغير فعلاً</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#a0a0a0">تغيّر النشاط الكهربائي مقارنة بالقدمين المتوازيتين · مرحلة النزول فقط · 80% من الحد الأقصى</text>
<line x1="250" y1="420" x2="760" y2="420" stroke="#3a3a3a" stroke-width="1.5"/>
