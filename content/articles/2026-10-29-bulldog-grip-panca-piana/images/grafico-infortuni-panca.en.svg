<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
.ttl{fill:#f0f0f0;font-size:19px;font-weight:700}
.sub{fill:#a0a0a0;font-size:13px}
.ax{fill:#a0a0a0;font-size:12px}
.cat{fill:#f0f0f0;font-size:13px}
.val{fill:#f0f0f0;font-size:17px;font-weight:700}
.src{fill:#a0a0a0;font-size:11px}
.grid{stroke:#262626;stroke-width:1}
.zero{stroke:#4a4a4a;stroke-width:1.5}
</style>
<rect width="900" height="430" fill="#0c0c0c"/>

<text x="40" y="42" class="ttl" text-anchor="start">Where lifters get hurt in a bench-press-only sport</text>
<text x="40" y="64" class="sub" text-anchor="start">Share of all injuries (%)</text>
<text x="40" y="92" class="cat" text-anchor="start">Shoulder and clavicle</text>
<rect x="40" y="100" width="371.2" height="40" fill="#f3e5ab" rx="4"/>
<text x="423.2" y="126.0" class="val" text-anchor="start">32%</text>
<text x="40" y="164" class="cat" text-anchor="start">Chest</text>
<rect x="40" y="172" width="150.8" height="40" fill="#d4af37" rx="4"/>
<text x="202.8" y="198.0" class="val" text-anchor="start">13%</text>
<text x="40" y="236" class="cat" text-anchor="start">Elbow</text>
<rect x="40" y="244" width="150.8" height="40" fill="#c09a30" rx="4"/>
<text x="202.8" y="270.0" class="val" text-anchor="start">13%</text>
<text x="40" y="308" class="cat" text-anchor="start">All other sites</text>
<rect x="40" y="316" width="487.2" height="40" fill="#aa8a2e" rx="4"/>
<text x="539.2" y="342.0" class="val" text-anchor="start">42%</text>
<text x="40" y="412" class="src" text-anchor="start">Data: Willick et al., 2015 (Scand J Med Sci Sports) · 38 injuries in 163 athletes, London 2012 Paralympics · Nurvan chart</text>
</svg>
