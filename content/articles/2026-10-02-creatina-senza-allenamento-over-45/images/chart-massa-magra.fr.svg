<text x="95.5" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">sans entraînement</text>
<rect x="198.5" y="100.4" width="80.1" height="87.9" fill="#d4af37" rx="3"/>
<text x="238.5" y="91.4" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">+1,10</text>
<text x="238.5" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Créatine</text>
<text x="238.5" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">sans entraînement</text>
<rect x="341.5" y="177.2" width="80.1" height="11.2" fill="#aa8a2e" rx="3"/>
<text x="381.5" y="168.2" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">+0,14</text>
