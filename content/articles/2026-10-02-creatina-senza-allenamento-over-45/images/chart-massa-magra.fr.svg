<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Diagramme en barres de la variation du tissu maigre à 12 semaines : placebo sans entraînement -0,16 kg, créatine sans entraînement +1,10 kg, placebo avec entraînement et diète +0,14 kg, créatine avec entraînement et diète +1,27 kg." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
<text x="24" y="26" fill="#f0f0f0" font-family="sans-serif" font-size="16" font-weight="700">Tissu maigre : variation à 12 semaines</text>
<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">Adultes de 45 à 65 ans, DXA, kg par rapport au départ</text>
<line x1="24" y1="188.4" x2="596" y2="188.4" stroke="#262626" stroke-width="1.5"/>
<rect x="55.5" y="188.4" width="80.1" height="12.8" fill="#aa8a2e" rx="3"/>
