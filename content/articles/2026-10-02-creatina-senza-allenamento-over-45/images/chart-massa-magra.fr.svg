<text x="381.5" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">+ entraînement et diète</text>
<rect x="484.5" y="86.9" width="80.1" height="101.5" fill="#d4af37" rx="3"/>
<text x="524.5" y="77.9" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">+1,27</text>
