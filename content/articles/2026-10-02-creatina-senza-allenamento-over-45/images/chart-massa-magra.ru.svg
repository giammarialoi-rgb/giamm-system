<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Столбчатая диаграмма изменения сухой ткани за 12 недель: плацебо без тренировок -0,16 кг, креатин без тренировок +1,10 кг, плацебо с тренировками и диетой +0,14 кг, креатин с тренировками и диетой +1,27 кг." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
