<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">Взрослые 45-65 лет, DXA, кг относительно начала</text>
<line x1="24" y1="188.4" x2="596" y2="188.4" stroke="#262626" stroke-width="1.5"/>
<rect x="55.5" y="188.4" width="80.1" height="12.8" fill="#aa8a2e" rx="3"/>
