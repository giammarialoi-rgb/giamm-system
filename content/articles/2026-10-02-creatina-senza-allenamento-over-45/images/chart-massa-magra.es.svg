<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">Adultos de 45 a 65 años, DXA, kg respecto al inicio</text>
<line x1="24" y1="188.4" x2="596" y2="188.4" stroke="#262626" stroke-width="1.5"/>
