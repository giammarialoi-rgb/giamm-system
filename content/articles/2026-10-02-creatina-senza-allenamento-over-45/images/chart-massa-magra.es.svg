<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Gráfico de barras del cambio de tejido magro a las 12 semanas: placebo sin entrenamiento -0,16 kg, creatina sin entrenamiento +1,10 kg, placebo con entrenamiento y dieta +0,14 kg, creatina con entrenamiento y dieta +1,27 kg." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
