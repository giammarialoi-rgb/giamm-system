<text x="381.5" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">+ entreno y dieta</text>
<rect x="484.5" y="86.9" width="80.1" height="101.5" fill="#d4af37" rx="3"/>
