<line x1="580.0" y1="14" x2="580.0" y2="160" stroke="#262626"/>
<text x="580.0" y="178" text-anchor="middle">+2 kg</text>
</g>
<g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12" fill="#a0a0a0"><rect x="200" y="192" width="12" height="12" rx="2" fill="#aa8a2e" opacity=".55"/><text x="218" y="202">1.2 g/kg</text><rect x="300" y="192" width="12" height="12" rx="2" fill="#d4af37"/><text x="318" y="202">2.4 g/kg</text></g>
<g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="13" fill="#f0f0f0">
<text x="0" y="48">Lean mass</text>
<rect x="485.0" y="24" width="4.8" height="20" rx="3" fill="#aa8a2e" opacity=".55"/>
