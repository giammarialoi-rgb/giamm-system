<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-label="Bar chart: lean mass +0.1 kg on 1.2 g/kg and +1.2 kg on 2.4 g/kg; fat mass −3.5 kg on 1.2 g/kg and −4.8 kg on 2.4 g/kg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="210" fill="#0c0c0c"/>
<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">
<line x1="200.0" y1="14" x2="200.0" y2="160" stroke="#262626"/>
<text x="200.0" y="178" text-anchor="middle">−6 kg</text>
<line x1="295.0" y1="14" x2="295.0" y2="160" stroke="#262626"/>
