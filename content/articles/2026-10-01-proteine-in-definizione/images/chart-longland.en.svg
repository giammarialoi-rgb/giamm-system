<text x="0" y="120">Fat mass</text>
<rect x="318.8" y="96" width="166.2" height="20" rx="3" fill="#aa8a2e" opacity=".55"/>
<text x="310.8" y="111" font-size="12" text-anchor="end" fill="#a0a0a0">−3.5 kg</text>
<rect x="257.0" y="122" width="228.0" height="20" rx="3" fill="#d4af37" opacity="1"/>
<text x="249.0" y="137" font-size="12" text-anchor="end" fill="#f3e5ab">−4.8 kg</text>
</g></svg>