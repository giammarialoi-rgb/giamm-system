<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 468" width="860" height="468" role="img">
<rect width="860" height="468" fill="#0c0c0c"/>
<text x="28" y="44" fill="#f0f0f0" font-family="Georgia, serif" font-size="25" font-weight="700">每天需要多少镁？</text>
<text x="28" y="70" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="14">官方参考值（毫克/天）与帖子建议的对比</text>
<line x1="320.0" y1="104" x2="320.0" y2="350" stroke="#2a2a2a" stroke-width="1"/>
<text x="320.0" y="98" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">0</text>
<line x1="392.3" y1="104" x2="392.3" y2="350" stroke="#2a2a2a" stroke-width="1"/>
<text x="392.3" y="98" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">100</text>
<line x1="464.6" y1="104" x2="464.6" y2="350" stroke="#2a2a2a" stroke-width="1"/>
<text x="464.6" y="98" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">200</text>
<line x1="536.9" y1="104" x2="536.9" y2="350" stroke="#2a2a2a" stroke-width="1"/>
<text x="536.9" y="98" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">300</text>
<line x1="609.2" y1="104" x2="609.2" y2="350" stroke="#2a2a2a" stroke-width="1"/>
<text x="609.2" y="98" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">400</text>
<line x1="681.5" y1="104" x2="681.5" y2="350" stroke="#2a2a2a" stroke-width="1"/>
<text x="681.5" y="98" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">500</text>
<line x1="753.8" y1="104" x2="753.8" y2="350" stroke="#2a2a2a" stroke-width="1"/>
<text x="753.8" y="98" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">600</text>
<text x="300" y="137" fill="#f0f0f0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="end">女性 — 欧盟参考值（EFSA）</text>
<rect x="320" y="122" width="216.9" height="22" fill="#d4af37" rx="2"/>
<text x="544.9" y="138" fill="#f3e5ab" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">300</text>
<text x="300" y="177" fill="#f0f0f0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="end">男性 — 欧盟参考值（EFSA）</text>
<rect x="320" y="162" width="253.1" height="22" fill="#d4af37" rx="2"/>
<text x="581.1" y="178" fill="#f3e5ab" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">350</text>
<text x="300" y="217" fill="#f0f0f0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="end">女性 — 美国参考值</text>
<rect x="320" y="202" width="231.4" height="22" fill="#d4af37" rx="2"/>
<text x="559.4" y="218" fill="#f3e5ab" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">320</text>
<text x="300" y="257" fill="#f0f0f0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="end">男性 — 美国参考值</text>
<rect x="320" y="242" width="303.7" height="22" fill="#d4af37" rx="2"/>
<text x="631.7" y="258" fill="#f3e5ab" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">420</text>
<text x="300" y="297" fill="#f0f0f0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="end">帖子：“至少 400-500”</text>
<rect x="320" y="282" width="289.2" height="22" fill="#aa8a2e" rx="2"/>
<text x="617.2" y="298" fill="#f3e5ab" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">400</text>
<text x="300" y="337" fill="#f0f0f0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="end">帖子：“最多 600”</text>
<rect x="320" y="322" width="433.8" height="22" fill="#aa8a2e" rx="2"/>
<text x="761.8" y="338" fill="#f3e5ab" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">600</text>
<line x1="500.8" y1="104" x2="500.8" y2="350" stroke="#e05c4a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="28" y="380" fill="#e05c4a" font-family="Helvetica, Arial, sans-serif" font-size="12.5">│ 欧盟补充剂镁上限：250 毫克/天</text>
<text x="28" y="404" fill="#a0a0a0" font-family="Helvetica, Arial, sans-serif" font-size="11.5">来源：EFSA 2015；NIH Office of Dietary Supplements；欧盟食品科学委员会 2001。上限只针对补充剂，不包括食物中的镁。</text>
<text x="832" y="454" fill="#aa8a2e" font-family="Georgia, serif" font-size="12" text-anchor="end" letter-spacing="2">NURVAN</text>
</svg>