<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="460" fill="#0c0c0c"/><text x="30" y="36" fill="#f0f0f0" font-size="20" font-weight="700" font-family="system-ui,sans-serif">वह मात्रा जो पोस्ट नहीं बताती</text><text x="30" y="70" fill="#d4af37" font-size="13" font-weight="700" font-family="system-ui,sans-serif">लिया गया शर्करा</text><rect x="30" y="84" width="560.0" height="30" fill="#d4af37" rx="4"/><text x="600" y="105" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">562 ग्राम</text><text x="30" y="132" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">Fuchs 2016 अध्ययन</text><text x="30" y="147" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">(5 घंटे, 75 किग्रा एथलीट)</text><rect x="30" y="170" width="15.9" height="30" fill="#aa8a2e" rx="4"/><text x="56" y="191" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">16 ग्राम</text><text x="30" y="218" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">1 बड़ा चम्मच शहद</text><text x="30" y="233" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">(20 ग्राम, CREA तालिका)</text><line x1="30" y1="260" x2="730" y2="260" stroke="#262626"/><text x="30" y="288" fill="#d4af37" font-size="13" font-weight="700" font-family="system-ui,sans-serif">5 घंटे में बढ़ा लिवर ग्लाइकोजन</text><rect x="30" y="302" width="464.8" height="28" fill="#f3e5ab" rx="4"/><text x="40" y="322" fill="#0c0c0c" font-size="13" font-weight="700" font-family="system-ui,sans-serif">सुक्रोज</text><text x="505" y="322" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">+33.2 ग्राम</text><rect x="30" y="344" width="229.6" height="28" fill="#6ea8d8" rx="4"/><text x="40" y="364" fill="#0c0c0c" font-size="13" font-weight="700" font-family="system-ui,sans-serif">शुद्ध ग्लूकोज</text><text x="270" y="364" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">+16.4 ग्राम</text><line x1="30" y1="392" x2="730" y2="392" stroke="#262626"/><text x="30" y="414" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">स्रोत: Fuchs et al., 2016, J Appl Physiol (PMID 27013608); CREA 2019, कोड 210010. 562 ग्राम = 75</text><text x="30" y="429" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">किग्रा पर 1.5 ग्राम/किग्रा/घंटा, 5 घंटे तक।</text></svg>