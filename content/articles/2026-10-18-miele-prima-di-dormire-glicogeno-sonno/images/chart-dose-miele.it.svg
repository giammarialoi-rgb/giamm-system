<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="460" fill="#0c0c0c"/><text x="30" y="36" fill="#f0f0f0" font-size="20" font-weight="700" font-family="system-ui,sans-serif">La dose che il post non dice</text><text x="30" y="70" fill="#d4af37" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Zuccheri assunti</text><rect x="30" y="84" width="560.0" height="30" fill="#d4af37" rx="4"/><text x="600" y="105" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">562 g</text><text x="30" y="132" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">Studio Fuchs 2016</text><text x="30" y="147" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">(5 ore, atleta 75 kg)</text><rect x="30" y="170" width="15.9" height="30" fill="#aa8a2e" rx="4"/><text x="56" y="191" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">16 g</text><text x="30" y="218" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">1 cucchiaio di miele</text><text x="30" y="233" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">(20 g, tabelle CREA)</text><line x1="30" y1="260" x2="730" y2="260" stroke="#262626"/><text x="30" y="288" fill="#d4af37" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Glicogeno epatico guadagnato in 5 ore</text><rect x="30" y="302" width="464.8" height="28" fill="#f3e5ab" rx="4"/><text x="40" y="322" fill="#0c0c0c" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Saccarosio</text><text x="505" y="322" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">+33,2 g</text><rect x="30" y="344" width="229.6" height="28" fill="#6ea8d8" rx="4"/><text x="40" y="364" fill="#0c0c0c" font-size="13" font-weight="700" font-family="system-ui,sans-serif">Glucosio puro</text><text x="270" y="364" fill="#f0f0f0" font-size="15" font-weight="700" font-family="system-ui,sans-serif">+16,4 g</text><line x1="30" y1="392" x2="730" y2="392" stroke="#262626"/><text x="30" y="414" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">Fonti: Fuchs et al., 2016, J Appl Physiol (PMID 27013608); CREA 2019, codice 210010. 562 g = 1,5 g/kg/h per 5</text><text x="30" y="429" fill="#a0a0a0" font-size="11.5" font-family="system-ui,sans-serif">ore su 75 kg.</text></svg>