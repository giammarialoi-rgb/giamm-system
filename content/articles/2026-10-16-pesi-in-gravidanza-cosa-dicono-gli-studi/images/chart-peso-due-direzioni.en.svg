<svg role="img" aria-label="Pregnancy weight gain moves both ways — Change in odds with exercise (84 studies, 21,530 women)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Inter, Segoe UI, Noto Sans, Noto Sans Arabic, Noto Sans Devanagari, Noto Sans SC, Helvetica, Arial, sans-serif">
<rect width="880" height="420" fill="#0c0c0c"/>
<text x="40" y="46" fill="#f0f0f0" font-size="25" font-weight="700">Pregnancy weight gain moves both ways</text>
<text x="40" y="76" fill="#a0a0a0" font-size="15">Change in odds with exercise (84 studies, 21,530 women)</text>
<line x1="470" y1="110" x2="470" y2="330" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="270" y="142" width="200" height="38" rx="5" fill="#aa8a2e"/>
<text x="258" y="170" fill="#f3e5ab" font-size="23" font-weight="700" text-anchor="end">-32%</text>
<text x="40" y="126" fill="#f0f0f0" font-size="18" font-weight="600">Excessive weight gain</text>
<text x="40" y="202" fill="#a0a0a0" font-size="13">OR 0.68 · low-to-moderate quality</text>
<rect x="470" y="252" width="200" height="38" rx="5" fill="#d4af37"/>
<text x="682" y="280" fill="#f3e5ab" font-size="23" font-weight="700">+32%</text>
<text x="40" y="236" fill="#f0f0f0" font-size="18" font-weight="600">Inadequate weight gain</text>
<text x="40" y="312" fill="#a0a0a0" font-size="13">OR 1.32 · HIGH quality</text>
<line x1="40" y1="358" x2="840" y2="358" stroke="#2a2a2a" stroke-width="1"/>
<text x="40" y="384" fill="#a0a0a0" font-size="12.5">Source: Ruchat et al., 2018 (PMID 30337461)</text>
<text x="40" y="406" fill="#aa8a2e" font-size="12" font-weight="600">NURVAN</text>
</svg>