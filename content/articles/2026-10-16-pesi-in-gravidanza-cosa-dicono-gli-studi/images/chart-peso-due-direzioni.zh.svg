<svg role="img" aria-label="孕期体重有两个方向 — 运动带来的几率变化（84 项研究，21,530 名女性）" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Inter, Segoe UI, Noto Sans, Noto Sans Arabic, Noto Sans Devanagari, Noto Sans SC, Helvetica, Arial, sans-serif">
