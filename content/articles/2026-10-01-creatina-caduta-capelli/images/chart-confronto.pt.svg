<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="Comparação: estudo de 2009 com duração de 3 semanas, 20 participantes, nenhuma medida do cabelo; trial de 2025 com duração de 12 semanas, 45 participantes recrutados, 3 medidas do cabelo">
<rect width="600" height="240" fill="#0c0c0c"/>
<g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12" fill="#a0a0a0"><rect x="200" y="216" width="12" height="12" rx="2" fill="#aa8a2e" opacity=".55"/><text x="218" y="226">van der Merwe 2009</text><rect x="370" y="216" width="12" height="12" rx="2" fill="#d4af37"/><text x="388" y="226">Lak 2025</text></g>
<g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="13" fill="#f0f0f0">
<text x="0" y="42">Duração (semanas)</text>
