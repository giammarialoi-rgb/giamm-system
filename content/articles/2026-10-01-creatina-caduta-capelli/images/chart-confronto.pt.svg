<rect x="200" y="40" width="264.0" height="20" rx="3" fill="#d4af37" opacity="1"/>
<text x="472.0" y="55" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace" fill="#f3e5ab">12</text>
