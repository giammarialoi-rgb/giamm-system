<rect x="200" y="80" width="132.0" height="20" rx="3" fill="#aa8a2e" opacity=".55"/>
<text x="340.0" y="95" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace" fill="#a0a0a0">20</text>
<rect x="200" y="106" width="297.0" height="20" rx="3" fill="#d4af37" opacity="1"/>
<text x="505.0" y="121" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace" fill="#f3e5ab">45</text>
