<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Grafico a barre: dosi da 2,2 a 14 g al giorno non hanno mostrato effetti cognitivi, mentre 20 g al giorno per 5-7 giorni e dosi singole da 0,2 e 0,35 g/kg (circa 14 e 24,5 grammi per 70 kg) ne hanno mostrato uno" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="900" height="470" fill="#0c0c0c"/>
<text x="28" y="40" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700">Le dosi in cui si è visto un effetto non sono quelle del misurino</text>
<text x="28" y="66" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13">Creatina monoidrato: dose impiegata ed esito cognitivo negli studi</text>
<line x1="330.0" y1="98" x2="330.0" y2="352" stroke="#262626" stroke-width="1"/>
<text x="330.0" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">0</text>
<line x1="420.4" y1="98" x2="420.4" y2="352" stroke="#262626" stroke-width="1"/>
<text x="420.4" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">5</text>
<line x1="510.8" y1="98" x2="510.8" y2="352" stroke="#262626" stroke-width="1"/>
<text x="510.8" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">10</text>
<line x1="601.2" y1="98" x2="601.2" y2="352" stroke="#262626" stroke-width="1"/>
<text x="601.2" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">15</text>
<line x1="691.5" y1="98" x2="691.5" y2="352" stroke="#262626" stroke-width="1"/>
<text x="691.5" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">20</text>
<line x1="781.9" y1="98" x2="781.9" y2="352" stroke="#262626" stroke-width="1"/>
<text x="781.9" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">25</text>
<text x="316" y="124" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">Da 2,2 a 14 g al giorno</text>
<text x="316" y="142" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">assunzione continuativa, 5 g per 6 settimane inclusi</text>
<rect x="330" y="110" width="253.1" height="30" fill="#555555" rx="2"/>
<text x="595.1" y="130" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">fino a 14 g</text>
<text x="316" y="186" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">0,2 g/kg in dose singola</text>
<text x="316" y="204" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">≈ 14 g per 70 kg · dopo 21 ore di veglia</text>
<rect x="330" y="172" width="253.1" height="30" fill="#d4af37" rx="2"/>
<text x="595.1" y="192" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">≈ 14 g</text>
<text x="316" y="248" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">20 g al giorno per 5-7 giorni</text>
<text x="316" y="266" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">memoria di lavoro, 2 studi</text>
<rect x="330" y="234" width="361.5" height="30" fill="#d4af37" rx="2"/>
<text x="703.5" y="254" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">20 g</text>
<text x="316" y="310" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">0,35 g/kg in dose singola</text>
<text x="316" y="328" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">≈ 24,5 g per 70 kg · dopo 21 ore di veglia</text>
<rect x="330" y="296" width="442.9" height="30" fill="#d4af37" rx="2"/>
<text x="784.9" y="316" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">≈ 24,5 g</text>
<text x="330" y="392" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11">grammi di creatina (dose giornaliera o dose singola)</text>
<rect x="28" y="404" width="14" height="12" fill="#d4af37" rx="2"/>
<text x="50" y="415" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11.5">effetto osservato</text>
<rect x="169" y="404" width="14" height="12" fill="#555555" rx="2"/>
<text x="191" y="415" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11.5">nessun effetto</text>
<text x="28" y="442" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">Fonti: EFSA, 2024, EFSA Journal 22(11):e9100 (PMID 39564533); Gordji-Nejad et al., 2024 (PMID 38418482) e 2026 (PMID 42075005). Conversione da g/kg a grammi per 70</text>
<text x="28" y="457" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">kg: elaborazione Nurvan.</text>
<text x="872" y="40" fill="#aa8a2e" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2">NURVAN</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>