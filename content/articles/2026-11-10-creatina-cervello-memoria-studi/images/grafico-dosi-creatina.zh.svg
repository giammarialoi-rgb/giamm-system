<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="柱状图：每天 2.2 到 14 克未显示认知效应，而每天 20 克连用 5-7 天以及单次 0.2 和 0.35 克/公斤（70 公斤约 14 克与 24.5 克）则显示出效应" xmlns:c2pa="http://c2pa.org/manifest">
