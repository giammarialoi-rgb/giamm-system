<text x="316" y="231" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">подгруппа</text>
<text x="316" y="289" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">Молодые (11-31 год)</text>
