<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Точечный график с доверительными интервалами: эффект креатина на память составляет SMD 0,29 у всех здоровых взрослых, 0,88 у пожилых 66-76 лет и 0,03 у молодых 11-31 года (незначимо)" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="900" height="470" fill="#0c0c0c"/>
<text x="28" y="40" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700">Креатин и память: эффект зависит от возраста</text>
<text x="28" y="66" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13">Стандартизованная разность средних и 95% доверительный интервал, 8 рандомизированных исследований</text>
<line x1="330.0" y1="98" x2="330.0" y2="340" stroke="#262626" stroke-width="1"/>
