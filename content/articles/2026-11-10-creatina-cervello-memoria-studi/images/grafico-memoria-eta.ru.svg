<line x1="541.4" y1="124" x2="541.4" y2="140" stroke="#d4af37" stroke-width="2"/>
<circle cx="486.8" cy="132" r="7" fill="#d4af37"/>
<text x="553.4" y="137" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">0,29</text>
<text x="316" y="155" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">8 рандомизированных исследований</text>
<text x="316" y="213" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">Пожилые (66-76 лет)</text>
