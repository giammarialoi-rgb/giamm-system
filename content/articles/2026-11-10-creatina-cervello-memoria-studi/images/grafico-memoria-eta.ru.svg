<text x="135" y="409" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11.5">незначимо</text>
<text x="28" y="442" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">Примечание: при пересчёте корректным методом общий эффект перестал быть значимым, у пожилых он сохранился (Citherlet, 2026).</text>
<text x="28" y="457" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">Источник: Prokopidis et al., 2023, Nutrition Reviews 81(4):416-427 (PMID 35984306). Значения из аннотации.</text>
<text x="872" y="40" fill="#aa8a2e" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2">NURVAN</text>
