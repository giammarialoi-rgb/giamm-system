<text x="511.8" y="358" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">0,4</text>
<line x1="602.7" y1="98" x2="602.7" y2="340" stroke="#262626" stroke-width="1"/>
<text x="602.7" y="358" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">0,8</text>
<line x1="693.6" y1="98" x2="693.6" y2="340" stroke="#262626" stroke-width="1"/>
<text x="693.6" y="358" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">1,2</text>
<line x1="784.5" y1="98" x2="784.5" y2="340" stroke="#262626" stroke-width="1"/>
<text x="784.5" y="358" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">1,6</text>
<text x="316" y="137" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">Все здоровые взрослые</text>
<line x1="430.0" y1="132" x2="541.4" y2="132" stroke="#d4af37" stroke-width="2"/>
