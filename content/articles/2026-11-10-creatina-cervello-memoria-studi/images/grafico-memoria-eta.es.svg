<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Gráfico de puntos con intervalos de confianza: el efecto de la creatina sobre la memoria es SMD 0,29 en todos los adultos sanos, 0,88 en mayores de 66 a 76 años y 0,03 en jóvenes de 11 a 31 años (no significativo)" xmlns:c2pa="http://c2pa.org/manifest">
