<text x="28" y="442" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">Nota: en el reanálisis con método apropiado el efecto global dejó de ser significativo, aunque se mantuvo en mayores (Citherlet, 2026).</text>
