<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="رسم بياني بأعمدة: الجرعات من 2.2 إلى 14 غراماً يومياً لم تُظهر أثراً معرفياً، في حين أظهرته 20 غراماً يومياً لمدة 5-7 أيام والجرعات المفردة 0.2 و0.35 غرام/كغ (نحو 14 و24.5 غراماً عند 70 كغ)" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="900" height="470" fill="#0c0c0c"/>
<text x="28" y="40" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700">الجرعات التي ظهر عندها أثر ليست جرعة المغرفة</text>
<text x="28" y="66" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13">أحادي هيدرات الكرياتين: الجرعة المستخدمة والنتيجة المعرفية في الدراسات</text>
<line x1="330.0" y1="98" x2="330.0" y2="352" stroke="#262626" stroke-width="1"/>
<text x="330.0" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">0</text>
<line x1="420.4" y1="98" x2="420.4" y2="352" stroke="#262626" stroke-width="1"/>
<text x="420.4" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">5</text>
<line x1="510.8" y1="98" x2="510.8" y2="352" stroke="#262626" stroke-width="1"/>
<text x="510.8" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">10</text>
<line x1="601.2" y1="98" x2="601.2" y2="352" stroke="#262626" stroke-width="1"/>
<text x="601.2" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">15</text>
<line x1="691.5" y1="98" x2="691.5" y2="352" stroke="#262626" stroke-width="1"/>
<text x="691.5" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">20</text>
<line x1="781.9" y1="98" x2="781.9" y2="352" stroke="#262626" stroke-width="1"/>
<text x="781.9" y="370" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">25</text>
<text x="316" y="124" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">من 2.2 إلى 14 غراماً يومياً</text>
<text x="316" y="142" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">تناول مستمر، ويشمل 5 غرامات لستة أسابيع</text>
<rect x="330" y="110" width="253.1" height="30" fill="#555555" rx="2"/>
<text x="595.1" y="130" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">حتى 14 غ</text>
<text x="316" y="186" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">0.2 غ/كغ جرعة مفردة</text>
<text x="316" y="204" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">≈ 14 غراماً عند 70 كغ · بعد 21 ساعة استيقاظ</text>
<rect x="330" y="172" width="253.1" height="30" fill="#d4af37" rx="2"/>
<text x="595.1" y="192" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">≈ 14 غ</text>
<text x="316" y="248" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">20 غراماً يومياً لمدة 5-7 أيام</text>
<text x="316" y="266" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">الذاكرة العاملة، دراستان</text>
<rect x="330" y="234" width="361.5" height="30" fill="#d4af37" rx="2"/>
<text x="703.5" y="254" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">20 غ</text>
<text x="316" y="310" fill="#f0f0f0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end">0.35 غ/كغ جرعة مفردة</text>
<text x="316" y="328" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">≈ 24.5 غراماً عند 70 كغ · بعد 21 ساعة استيقاظ</text>
<rect x="330" y="296" width="442.9" height="30" fill="#d4af37" rx="2"/>
<text x="784.9" y="316" fill="#f3e5ab" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">≈ 24.5 غ</text>
<text x="330" y="392" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11">غرامات الكرياتين (جرعة يومية أو مفردة)</text>
<rect x="28" y="404" width="14" height="12" fill="#d4af37" rx="2"/>
<text x="50" y="415" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11.5">ظهر أثر</text>
<rect x="115" y="404" width="14" height="12" fill="#555555" rx="2"/>
<text x="137" y="415" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="11.5">لا أثر</text>
<text x="28" y="442" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">المصادر: EFSA، 2024، EFSA Journal 22(11):e9100 (PMID 39564533)؛ Gordji-Nejad وزملاؤه، 2024 (PMID 38418482) و2026 (PMID 42075005). تحويل غ/كغ إلى غرامات لوزن 70</text>
<text x="28" y="457" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">كغ: حساب من Nurvan.</text>
<text x="872" y="40" fill="#aa8a2e" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2">NURVAN</text>
