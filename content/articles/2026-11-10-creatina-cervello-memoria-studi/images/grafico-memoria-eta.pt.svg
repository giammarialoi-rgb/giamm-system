<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Gráfico de pontos com intervalos de confiança: o efeito da creatina na memória é SMD 0,29 em todos os adultos saudáveis, 0,88 nos mais velhos entre 66 e 76 anos e 0,03 nos jovens entre 11 e 31 anos (não significativo)" xmlns:c2pa="http://c2pa.org/manifest">
