<text x="28" y="457" fill="#a0a0a0" font-family="Helvetica,Arial,sans-serif" font-size="10.5">Fonte: Prokopidis et al., 2023, Nutrition Reviews 81(4):416-427 (PMID 35984306). Valores do resumo.</text>
