<text x="24" y="56" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">19 项试验、768 人的荟萃分析，补充胶原蛋白并训练至少 8 周</text>
