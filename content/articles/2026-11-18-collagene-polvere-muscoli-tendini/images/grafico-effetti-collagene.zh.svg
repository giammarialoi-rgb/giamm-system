<text x="24" y="446" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">颜色越浅表示证据确定性越高。来源：Bischof et al., 2024, Sports Medicine</text>
