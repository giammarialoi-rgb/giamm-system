<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="横向柱状图展示荟萃分析效应：肌腱形态 0.67 但证据极低确定性，去脂体重 0.48 为中等确定性，48 小时恢复 0.43、肌肉结构 0.39、最大力量 0.19 均为低确定性" xmlns:c2pa="http://c2pa.org/manifest"><metadata/>
<rect width="900" height="460" fill="#0c0c0c"/>
