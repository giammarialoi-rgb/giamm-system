<text x="470.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0.4</text>
<line x1="555.0" y1="96" x2="555.0" y2="386" stroke="#262626" stroke-width="1"/>
<text x="555.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0.6</text>
<line x1="640.0" y1="96" x2="640.0" y2="386" stroke="#262626" stroke-width="1"/>
<text x="640.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0.8</text>
<line x1="385.0" y1="96" x2="385.0" y2="386" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="385.0" y="86" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">小</text>
<line x1="512.5" y1="96" x2="512.5" y2="386" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="512.5" y="86" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">中</text>
<rect x="300" y="108" width="284.8" height="30" fill="#6b5a22" rx="3"/>
<text x="286" y="129" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">肌腱形态</text>
