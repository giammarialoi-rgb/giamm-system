<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Horizontal bar chart of meta-analysis effects: tendon morphology 0.67 at very low certainty, fat-free mass 0.48 at moderate certainty, 48-hour recovery 0.43, muscle architecture 0.39 and maximal strength 0.19, all at low certainty" xmlns:c2pa="http://c2pa.org/manifest"><metadata/>
<rect width="900" height="460" fill="#0c0c0c"/>
<text x="24" y="34" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">How big the effect is, and how far to trust it</text>
<text x="24" y="56" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Meta-analysis of 19 trials, 768 people, at least 8 weeks of collagen plus training</text>
<line x1="300.0" y1="96" x2="300.0" y2="386" stroke="#262626" stroke-width="1"/>
<text x="300.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0</text>
<line x1="385.0" y1="96" x2="385.0" y2="386" stroke="#262626" stroke-width="1"/>
<text x="385.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0.2</text>
<line x1="470.0" y1="96" x2="470.0" y2="386" stroke="#262626" stroke-width="1"/>
<text x="470.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0.4</text>
<line x1="555.0" y1="96" x2="555.0" y2="386" stroke="#262626" stroke-width="1"/>
<text x="555.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0.6</text>
<line x1="640.0" y1="96" x2="640.0" y2="386" stroke="#262626" stroke-width="1"/>
<text x="640.0" y="406" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">0.8</text>
<line x1="385.0" y1="96" x2="385.0" y2="386" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="385.0" y="86" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">small</text>
<line x1="512.5" y1="96" x2="512.5" y2="386" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="512.5" y="86" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">medium</text>
<rect x="300" y="108" width="284.8" height="30" fill="#6b5a22" rx="3"/>
<text x="286" y="129" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">Tendon morphology</text>
<text x="660" y="129" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">0.67</text>
<text x="718" y="129" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">very low certainty</text>
<rect x="300" y="166" width="204.0" height="30" fill="#d4af37" rx="3"/>
<text x="286" y="187" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">Fat-free mass</text>
<text x="660" y="187" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">0.48</text>
<text x="718" y="187" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">moderate certainty</text>
<rect x="300" y="224" width="182.8" height="30" fill="#aa8a2e" rx="3"/>
<text x="286" y="245" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">48 h recovery</text>
<text x="660" y="245" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">0.43</text>
<text x="718" y="245" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">low certainty</text>
<rect x="300" y="282" width="165.8" height="30" fill="#aa8a2e" rx="3"/>
<text x="286" y="303" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">Muscle architecture</text>
<text x="660" y="303" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">0.39</text>
<text x="718" y="303" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">low certainty</text>
<rect x="300" y="340" width="80.8" height="30" fill="#aa8a2e" rx="3"/>
<text x="286" y="361" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="end">Maximal strength</text>
<text x="660" y="361" fill="#f0f0f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">0.19</text>
<text x="718" y="361" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">low certainty</text>
<line x1="300" y1="96" x2="300" y2="386" stroke="#262626" stroke-width="1.5"/>
<text x="300" y="430" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="start">standardised mean difference (SMD)</text>
<text x="24" y="446" fill="#a0a0a0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">Lighter bars = higher certainty of evidence. Source: Bischof et al., 2024, Sports Medicine</text>
