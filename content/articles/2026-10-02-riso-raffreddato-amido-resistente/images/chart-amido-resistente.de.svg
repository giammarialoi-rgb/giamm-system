<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Balkendiagramm der resistenten Stärke in weißem Reis: 0,64 g pro 100 g frisch gekocht, 1,30 nach 10 Stunden bei Raumtemperatur, 1,65 nach 24 Stunden bei 4 Grad und erneutem Erhitzen." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
<text x="24" y="26" fill="#f0f0f0" font-family="sans-serif" font-size="16" font-weight="700">Resistente Stärke in gekochtem weißem Reis</text>
<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">Gramm pro 100 g Reis</text>
<line x1="24" y1="201.1" x2="596" y2="201.1" stroke="#262626" stroke-width="1.5"/>
<rect x="65.9" y="156.8" width="106.8" height="44.3" fill="#aa8a2e" rx="3"/>
<text x="119.3" y="147.8" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">0,64</text>
<text x="119.3" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Frisch gekocht</text>
<rect x="256.6" y="111.1" width="106.8" height="90.0" fill="#aa8a2e" rx="3"/>
<text x="310.0" y="102.1" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">1,30</text>
<text x="310.0" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">10 h abgekühlt</text>
<text x="310.0" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">bei Raumtemperatur</text>
<rect x="447.3" y="86.9" width="106.8" height="114.3" fill="#d4af37" rx="3"/>
<text x="500.7" y="77.9" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">1,65</text>
<text x="500.7" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">24 h bei 4 °C</text>
<text x="500.7" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">dann erhitzt</text>
<text x="24" y="286" fill="#a0a0a0" font-family="sans-serif" font-size="11">Daten: Sonia et al. 2015, Asia Pac J Clin Nutr (PMID 26693746). Grafik von Nurvan.</text>
