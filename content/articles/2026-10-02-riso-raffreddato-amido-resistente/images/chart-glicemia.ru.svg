<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Столбчатая диаграмма: по сравнению со свежесваренным рисом охлаждённый неклейкий рис снижает гликемическую площадь на 24,4%, охлаждённое неклейкое просо — на 29,5%, а клейкие злаки значимой разницы не дают." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
<text x="24" y="26" fill="#f0f0f0" font-family="sans-serif" font-size="16" font-weight="700">Сахар после еды: отличие от свежесваренного риса</text>
<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">Площадь под кривой глюкозы за 4 часа, 50 г углеводов на приём</text>
<line x1="24" y1="86.9" x2="596" y2="86.9" stroke="#262626" stroke-width="1.5"/>
<rect x="65.9" y="86.9" width="106.8" height="94.5" fill="#d4af37" rx="3"/>
<text x="119.3" y="198.4" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">-24,4%</text>
<text x="119.3" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Неклейкий рис</text>
<text x="119.3" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">охлаждённый</text>
<rect x="256.6" y="86.9" width="106.8" height="114.3" fill="#d4af37" rx="3"/>
<text x="310.0" y="218.1" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">-29,5%</text>
<text x="310.0" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Неклейкое просо</text>
<text x="310.0" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">охлаждённое</text>
<rect x="447.3" y="86.9" width="106.8" height="1.0" fill="#aa8a2e" rx="3"/>
<text x="500.7" y="77.9" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">≈ 0</text>
<text x="500.7" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Клейкие злаки</text>
<text x="500.7" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">(рис и просо):</text>
<text x="500.7" y="276.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">без разницы</text>
<text x="24" y="286" fill="#a0a0a0" font-family="sans-serif" font-size="11">Данные: Peng et al. 2024, Nutrients (PMID 39683424). График Nurvan.</text>
</svg>