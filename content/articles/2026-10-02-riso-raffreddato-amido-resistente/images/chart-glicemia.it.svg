<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Grafico a barre: rispetto al riso appena cotto, il riso non glutinoso raffreddato riduce l&#x27;area glicemica del 24,4%, il miglio non glutinoso raffreddato del 29,5%, mentre per i cereali glutinosi non c&#x27;è differenza significativa." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
<text x="24" y="26" fill="#f0f0f0" font-family="sans-serif" font-size="16" font-weight="700">Glicemia dopo il pasto: variazione rispetto al riso appena cotto</text>
<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">Area sotto la curva del glucosio nelle prime 4 ore, 50 g di carboidrati per pasto</text>
<line x1="24" y1="86.9" x2="596" y2="86.9" stroke="#262626" stroke-width="1.5"/>
<rect x="65.9" y="86.9" width="106.8" height="94.5" fill="#d4af37" rx="3"/>
<text x="119.3" y="198.4" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">-24,4%</text>
<text x="119.3" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Riso non glutinoso</text>
<text x="119.3" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">raffreddato</text>
<rect x="256.6" y="86.9" width="106.8" height="114.3" fill="#d4af37" rx="3"/>
<text x="310.0" y="218.1" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">-29,5%</text>
<text x="310.0" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Miglio non glutinoso</text>
<text x="310.0" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">raffreddato</text>
<rect x="447.3" y="86.9" width="106.8" height="1.0" fill="#aa8a2e" rx="3"/>
<text x="500.7" y="77.9" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">≈ 0</text>
<text x="500.7" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Cereali glutinosi</text>
<text x="500.7" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">(riso e miglio):</text>
<text x="500.7" y="276.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">nessuna differenza</text>
<text x="24" y="286" fill="#a0a0a0" font-family="sans-serif" font-size="11">Dati: Peng et al. 2024, Nutrients (PMID 39683424). Grafico Nurvan.</text>
