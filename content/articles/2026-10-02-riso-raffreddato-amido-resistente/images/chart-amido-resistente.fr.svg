<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Diagramme en barres de l&#x27;amidon résistant dans le riz blanc : 0,64 g pour 100 g fraîchement cuit, 1,30 après 10 heures à température ambiante, 1,65 après 24 heures à 4 degrés puis réchauffage." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
