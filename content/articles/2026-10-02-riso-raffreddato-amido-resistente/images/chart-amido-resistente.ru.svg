<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Столбчатая диаграмма резистентного крахмала в белом рисе: 0,64 г на 100 г свежесваренного, 1,30 через 10 часов при комнатной температуре, 1,65 после 24 часов при 4 градусах и разогрева." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
<text x="24" y="26" fill="#f0f0f0" font-family="sans-serif" font-size="16" font-weight="700">Резистентный крахмал в варёном белом рисе</text>
<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">Граммы на 100 г риса</text>
<line x1="24" y1="201.1" x2="596" y2="201.1" stroke="#262626" stroke-width="1.5"/>
<rect x="65.9" y="156.8" width="106.8" height="44.3" fill="#aa8a2e" rx="3"/>
<text x="119.3" y="147.8" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">0,64</text>
<text x="119.3" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Свежесваренный</text>
<rect x="256.6" y="111.1" width="106.8" height="90.0" fill="#aa8a2e" rx="3"/>
<text x="310.0" y="102.1" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">1,30</text>
<text x="310.0" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">Остывал 10 ч</text>
<text x="310.0" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">при комнатной t°</text>
<rect x="447.3" y="86.9" width="106.8" height="114.3" fill="#d4af37" rx="3"/>
<text x="500.7" y="77.9" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">1,65</text>
