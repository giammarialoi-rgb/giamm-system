<text x="500.7" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">затем разогрет</text>
<text x="24" y="286" fill="#a0a0a0" font-family="sans-serif" font-size="11">Данные: Sonia et al. 2015, Asia Pac J Clin Nutr (PMID 26693746). График Nurvan.</text>
