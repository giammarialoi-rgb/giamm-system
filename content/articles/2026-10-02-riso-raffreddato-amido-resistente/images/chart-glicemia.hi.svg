<text x="500.7" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">चिपचिपे अनाज</text>
<text x="500.7" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">(चावल और बाजरा):</text>
<text x="500.7" y="276.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">कोई अंतर नहीं</text>
<text x="24" y="286" fill="#a0a0a0" font-family="sans-serif" font-size="11">डेटा: Peng et al. 2024, Nutrients (PMID 39683424). चार्ट: Nurvan.</text>
