<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="बार चार्ट: ताज़ा पके चावल की तुलना में ठंडा किया ग़ैर-चिपचिपा चावल ग्लाइसेमिक क्षेत्रफल 24.4% घटाता है, ठंडा किया ग़ैर-चिपचिपा बाजरा 29.5%, जबकि चिपचिपे अनाजों में कोई सार्थक अंतर नहीं।" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
<text x="24" y="26" fill="#f0f0f0" font-family="sans-serif" font-size="16" font-weight="700">भोजन के बाद शुगर: ताज़ा पके चावल की तुलना में बदलाव</text>
<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">4 घंटे का ग्लूकोज़ वक्र क्षेत्रफल, प्रति भोजन 50 ग्राम कार्बोहाइड्रेट</text>
<line x1="24" y1="86.9" x2="596" y2="86.9" stroke="#262626" stroke-width="1.5"/>
<rect x="65.9" y="86.9" width="106.8" height="94.5" fill="#d4af37" rx="3"/>
<text x="119.3" y="198.4" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">-24.4%</text>
<text x="119.3" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">ग़ैर-चिपचिपा चावल</text>
<text x="119.3" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">ठंडा</text>
<rect x="256.6" y="86.9" width="106.8" height="114.3" fill="#d4af37" rx="3"/>
<text x="310.0" y="218.1" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">-29.5%</text>
<text x="310.0" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">ग़ैर-चिपचिपा बाजरा</text>
<text x="310.0" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">ठंडा</text>
