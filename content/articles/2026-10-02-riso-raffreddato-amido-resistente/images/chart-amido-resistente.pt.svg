<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Gráfico de barras do amido resistente no arroz branco: 0,64 g por 100 g acabado de cozer, 1,30 após 10 horas à temperatura ambiente, 1,65 após 24 horas a 4 graus e reaquecimento." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
