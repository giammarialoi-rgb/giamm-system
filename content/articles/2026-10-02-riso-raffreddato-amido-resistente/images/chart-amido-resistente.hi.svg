<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="बार चार्ट: सफ़ेद चावल में रेज़िस्टेंट स्टार्च। ताज़ा पका 0.64 ग्राम प्रति 100 ग्राम, कमरे के तापमान पर 10 घंटे बाद 1.30, 4 डिग्री पर 24 घंटे और दोबारा गर्म करने के बाद 1.65।" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="620" height="300" fill="#0c0c0c"/>
<text x="24" y="26" fill="#f0f0f0" font-family="sans-serif" font-size="16" font-weight="700">पके सफ़ेद चावल में रेज़िस्टेंट स्टार्च</text>
<text x="24" y="46" fill="#a0a0a0" font-family="sans-serif" font-size="12">प्रति 100 ग्राम चावल, ग्राम में</text>
<line x1="24" y1="201.1" x2="596" y2="201.1" stroke="#262626" stroke-width="1.5"/>
<rect x="65.9" y="156.8" width="106.8" height="44.3" fill="#aa8a2e" rx="3"/>
<text x="119.3" y="147.8" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">0.64</text>
<text x="119.3" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">ताज़ा पका</text>
<rect x="256.6" y="111.1" width="106.8" height="90.0" fill="#aa8a2e" rx="3"/>
<text x="310.0" y="102.1" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">1.30</text>
<text x="310.0" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">कमरे के तापमान पर</text>
<text x="310.0" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">10 घंटे</text>
<rect x="447.3" y="86.9" width="106.8" height="114.3" fill="#d4af37" rx="3"/>
<text x="500.7" y="77.9" fill="#f3e5ab" font-family="monospace" font-size="13" text-anchor="middle">1.65</text>
<text x="500.7" y="246.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">4 °C पर 24 घंटे,</text>
<text x="500.7" y="261.0" fill="#a0a0a0" font-family="sans-serif" font-size="12" text-anchor="middle">फिर गर्म</text>
<text x="24" y="286" fill="#a0a0a0" font-family="sans-serif" font-size="11">डेटा: Sonia et al. 2015, Asia Pac J Clin Nutr (PMID 26693746). चार्ट: Nurvan.</text>
</svg>