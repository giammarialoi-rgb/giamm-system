<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Grafico a barre: amido resistente nel riso bianco, 0,64 g per 100 g appena cotto, 1,30 dopo 10 ore a temperatura ambiente, 1,65 dopo 24 ore a 4 gradi e riscaldamento." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
