<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="460" fill="#0c0c0c"/>
<text x="450.0" y="34" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">为什么问题出在剂型</text>
<text x="240.0" y="86" fill="#a0a0a0" font-size="14" text-anchor="middle">12 款软糖送检</text>
<line x1="60" y1="360" x2="420" y2="360" stroke="#a0a0a0" stroke-width="1"/>
<rect x="120" y="214.2" width="110" height="145.8" fill="#aa8a2e" rx="3"/>
<text x="175.0" y="204.2" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">7/12</text>
<text x="175.0" y="382" fill="#a0a0a0" font-size="12.5" text-anchor="middle">符合标示</text>
<rect x="280" y="255.8" width="110" height="104.2" fill="#d4af37" rx="3"/>
<text x="335.0" y="245.8" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">5/12</text>
<text x="335.0" y="382" fill="#a0a0a0" font-size="12.5" text-anchor="middle">肌酸很少或没有</text>
<text x="660.0" y="86" fill="#a0a0a0" font-size="14" text-anchor="middle">肌酸溶液，45 天</text>
<line x1="480" y1="360" x2="840" y2="360" stroke="#a0a0a0" stroke-width="1"/>
<rect x="540" y="135.0" width="110" height="225.0" fill="#d4af37" rx="3"/>
<text x="595.0" y="125.0" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">90%</text>
<text x="595.0" y="382" fill="#a0a0a0" font-size="12.5" text-anchor="middle">25 °C</text>
<text x="595.0" y="400" fill="#a0a0a0" font-size="12.5" text-anchor="middle">已降解</text>
<rect x="700" y="160.0" width="110" height="200.0" fill="#aa8a2e" rx="3"/>
<text x="755.0" y="150.0" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">80%</text>
<text x="755.0" y="382" fill="#a0a0a0" font-size="12.5" text-anchor="middle">冷藏（4 °C）</text>
<text x="755.0" y="400" fill="#a0a0a0" font-size="12.5" text-anchor="middle">已降解</text>
<text x="450.0" y="438" fill="#a0a0a0" font-size="11.5" text-anchor="middle">左：NOW Foods 对 12 款市售产品的实验室检测（SupplySide Supplement Journal，2024）。右：Ganguly 等，2003，AAPS PharmSciTech。</text>
