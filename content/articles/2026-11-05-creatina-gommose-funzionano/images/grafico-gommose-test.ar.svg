<text x="450.0" y="438" fill="#a0a0a0" font-size="11.5" text-anchor="middle">يسار: اختبار مختبري من NOW Foods على 12 منتجاً في الأسواق (SupplySide Supplement Journal، 2024). يمين: Ganguly وآخرون، 2003، AAPS PharmSciTech.</text>
