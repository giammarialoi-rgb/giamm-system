<text x="450.0" y="438" fill="#a0a0a0" font-size="11.5" text-anchor="middle">Links: Labortest von NOW Foods an 12 Handelsprodukten (SupplySide Supplement Journal, 2024). Rechts: Ganguly et al., 2003, AAPS PharmSciTech.</text>
