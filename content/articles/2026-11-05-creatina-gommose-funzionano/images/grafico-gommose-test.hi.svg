<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="460" fill="#0c0c0c"/>
<text x="450.0" y="34" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">दिक्कत फ़ॉर्मैट में क्यों है</text>
<text x="240.0" y="86" fill="#a0a0a0" font-size="14" text-anchor="middle">12 गमीज़ की लैब जाँच</text>
<line x1="60" y1="360" x2="420" y2="360" stroke="#a0a0a0" stroke-width="1"/>
<rect x="120" y="214.2" width="110" height="145.8" fill="#aa8a2e" rx="3"/>
<text x="175.0" y="204.2" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">7/12</text>
<text x="175.0" y="382" fill="#a0a0a0" font-size="12.5" text-anchor="middle">लेबल के अनुसार</text>
<rect x="280" y="255.8" width="110" height="104.2" fill="#d4af37" rx="3"/>
<text x="335.0" y="245.8" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">5/12</text>
<text x="335.0" y="382" fill="#a0a0a0" font-size="12.5" text-anchor="middle">बहुत कम या बिलकुल नहीं</text>
<text x="660.0" y="86" fill="#a0a0a0" font-size="14" text-anchor="middle">घोल में क्रिएटीन, 45 दिन</text>
<line x1="480" y1="360" x2="840" y2="360" stroke="#a0a0a0" stroke-width="1"/>
<rect x="540" y="135.0" width="110" height="225.0" fill="#d4af37" rx="3"/>
<text x="595.0" y="125.0" fill="#f0f0f0" font-size="22" font-weight="700" text-anchor="middle">90%</text>
