<text x="450.0" y="438" fill="#a0a0a0" font-size="11.5" text-anchor="middle">बाएँ: बाज़ार के 12 उत्पादों पर NOW Foods की लैब जाँच (SupplySide Supplement Journal, 2024)। दाएँ: Ganguly et al., 2003, AAPS PharmSciTech।</text>
