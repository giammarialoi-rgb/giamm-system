<text x="24" y="330" fill="#a0a0a0" font-size="11.5">每届赛事领奖台相邻名次之间的 48 个差距。阈值：总成绩的标准测量误差（6.09 公斤）与最小可检测差异（16.9 公斤），据 Amdi</text>
<text x="24" y="345" fill="#a0a0a0" font-size="11.5">等，2026。</text>
<text x="736" y="404" fill="#5a5a5a" font-size="11" text-anchor="end">NURVAN</text>
