<text x="490.8" y="183" fill="#f3e5ab" font-size="13.5" font-weight="600">29%</text>
<rect x="150" y="200" width="331.8" height="24" fill="#aa8a2e" rx="3"/>
<text x="490.8" y="217" fill="#f3e5ab" font-size="13.5" font-weight="600">29%</text>
<line x1="24" y1="228" x2="736" y2="228" stroke="#262626" stroke-width="1"/>
<text x="136" y="260" fill="#f0f0f0" font-size="14.5" text-anchor="end">超过 16.9 公斤</text>
