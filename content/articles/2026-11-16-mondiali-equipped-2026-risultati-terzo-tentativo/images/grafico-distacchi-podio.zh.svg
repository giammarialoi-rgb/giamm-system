<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="100%" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="760" height="416" fill="#0c0c0c"/>
