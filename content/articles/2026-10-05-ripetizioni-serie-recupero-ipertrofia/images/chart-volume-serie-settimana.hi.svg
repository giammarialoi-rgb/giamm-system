<text x="16" y="247" text-anchor="middle" class="ax" transform="rotate(-90 16 247)">अपेक्षित मसल वृद्धि (रुझान)</text>
<text x="270.0" y="308" text-anchor="middle" class="zn"><tspan x="270.0" dy="0">10 से कम:</tspan><tspan x="270.0" dy="14">बढ़त होती है, पर</tspan><tspan x="270.0" dy="14">क्षमता से कम</tspan></text>
