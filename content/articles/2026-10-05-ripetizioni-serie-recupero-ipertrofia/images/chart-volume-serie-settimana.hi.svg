<text x="722.6" y="162" text-anchor="middle" class="zn"><tspan x="722.6" dy="0">18-20 से ऊपर:</tspan><tspan x="722.6" dy="14">स्पष्ट रूप से</tspan><tspan x="722.6" dy="14">घटता</tspan><tspan x="722.6" dy="14">प्रतिफल</tspan></text>
<text x="72" y="518" text-anchor="start" class="nt"><tspan x="72" dy="0">हर अतिरिक्त साप्ताहिक सेट औसतन +0.37% मसल देता है (Schoenfeld et al. 2017). यह गुणात्मक रुझान है, निरपेक्ष पैमाना नहीं।</tspan></text>
