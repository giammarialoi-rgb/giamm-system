<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="条形图：在 2019 年的试验中，超加工饮食比未加工饮食每天多吃 508 千卡；在 2021 年的试验中，生酮饮食比低脂饮食每天多吃 689 千卡。" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.t{fill:#f0f0f0;font-size:21px;font-weight:700}.s{fill:#a0a0a0;font-size:13px}.ax{fill:#a0a0a0;font-size:12px}.cat{fill:#f0f0f0;font-size:13px}.big{fill:#f3e5ab;font-size:26px;font-weight:700}.nt{fill:#a0a0a0;font-size:12px}.sm{fill:#a0a0a0;font-size:12px}</style>
<rect width="900" height="500" fill="#0c0c0c"/>
<text x="24" y="34" class="t">敞开吃的时候，哪种饮食让人吃得更多</text>
<text x="24" y="56" class="s">两项 NIH 住院试验，食物不限量</text>
<text x="384" y="176" text-anchor="end" class="cat"><tspan x="384" dy="0">超加工饮食</tspan><tspan x="384" dy="17" class="sm">对比同样配方的未加工饮食（2019）</tspan></text>
<rect x="400" y="150" width="267" height="52" rx="4" fill="#e0683c"/>
<text x="681" y="186" class="big">+508</text>
<text x="384" y="306" text-anchor="end" class="cat"><tspan x="384" dy="0">生酮低碳水饮食</tspan><tspan x="384" dy="17" class="sm">对比低脂高碳水饮食（2021）</tspan></text>
<rect x="400" y="280" width="362" height="52" rx="4" fill="#d4af37"/>
<text x="776" y="316" class="big">+689</text>
<line x1="400" y1="126" x2="400" y2="362" stroke="#a0a0a0" stroke-width="1"/>
<text x="404" y="118" class="ax">每天多摄入的千卡</text>
<text x="24" y="418" class="nt">Hall et al. 2019（PMID 31105044），20 名成人，每种饮食 2 周，提供的宏量营养素已匹配。</text>
<text x="24" y="436" class="nt">Hall et al. 2021（PMID 33479499），20 名成人，每种饮食 2 周，两组均不限量。</text>
<text x="876" y="488" text-anchor="end" class="nt" fill="#aa8a2e">NURVAN</text>
</svg>