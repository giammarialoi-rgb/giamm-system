<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Bar chart: in the 2019 trial the ultra-processed diet led participants to eat 508 kcal a day more than the unprocessed one; in the 2021 trial the ketogenic diet led them to eat 689 kcal a day more than the low-fat one." font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.t{fill:#f0f0f0;font-size:21px;font-weight:700}.s{fill:#a0a0a0;font-size:13px}.ax{fill:#a0a0a0;font-size:12px}.cat{fill:#f0f0f0;font-size:13px}.big{fill:#f3e5ab;font-size:26px;font-weight:700}.nt{fill:#a0a0a0;font-size:12px}.sm{fill:#a0a0a0;font-size:12px}</style>
<rect width="900" height="500" fill="#0c0c0c"/>
<text x="24" y="34" class="t">Which diet makes you eat more, when food is unlimited</text>
<text x="24" y="56" class="s">Two NIH trials with inpatient participants and unrestricted food</text>
<text x="384" y="176" text-anchor="end" class="cat"><tspan x="384" dy="0">Ultra-processed diet</tspan><tspan x="384" dy="17" class="sm">vs the same diet unprocessed (2019)</tspan></text>
<rect x="400" y="150" width="267" height="52" rx="4" fill="#e0683c"/>
<text x="681" y="186" class="big">+508</text>
<text x="384" y="288" text-anchor="end" class="cat"><tspan x="384" dy="0">Ketogenic, low-carbohydrate</tspan><tspan x="384" dy="17">diet</tspan><tspan x="384" dy="17" class="sm">vs low-fat, high-carbohydrate diet</tspan><tspan x="384" dy="17" class="sm">(2021)</tspan></text>
<rect x="400" y="280" width="362" height="52" rx="4" fill="#d4af37"/>
<text x="776" y="316" class="big">+689</text>
<line x1="400" y1="126" x2="400" y2="362" stroke="#a0a0a0" stroke-width="1"/>
<text x="404" y="118" class="ax">extra kcal per day</text>
<text x="24" y="418" class="nt">Hall et al. 2019 (PMID 31105044), 20 adults, 2 weeks per diet, presented macronutrients matched.</text>
<text x="24" y="436" class="nt">Hall et al. 2021 (PMID 33479499), 20 adults, 2 weeks per diet, unlimited food in both arms.</text>
<text x="876" y="488" text-anchor="end" class="nt" fill="#aa8a2e">NURVAN</text>
</svg>