<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="बार चार्ट: 2019 के अध्ययन में अल्ट्रा-प्रोसेस्ड डाइट पर रोज़ 508 कैलोरी ज़्यादा खाई गईं; 2021 के अध्ययन में कीटोजेनिक डाइट पर कम वसा वाली डाइट से रोज़ 689 कैलोरी ज़्यादा खाई गईं।" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.t{fill:#f0f0f0;font-size:21px;font-weight:700}.s{fill:#a0a0a0;font-size:13px}.ax{fill:#a0a0a0;font-size:12px}.cat{fill:#f0f0f0;font-size:13px}.big{fill:#f3e5ab;font-size:26px;font-weight:700}.nt{fill:#a0a0a0;font-size:12px}.sm{fill:#a0a0a0;font-size:12px}</style>
<rect width="900" height="500" fill="#0c0c0c"/>
<text x="24" y="34" class="t">जब खाना असीमित हो, तो कौन-सी डाइट ज़्यादा खिलाती है</text>
<text x="24" y="56" class="s">भर्ती प्रतिभागियों और असीमित खाने के साथ NIH के दो अध्ययन</text>
<text x="384" y="167" text-anchor="end" class="cat"><tspan x="384" dy="0">अल्ट्रा-प्रोसेस्ड डाइट</tspan><tspan x="384" dy="17" class="sm">वही डाइट बिना प्रोसेसिंग के (2019)</tspan><tspan x="384" dy="17" class="sm">की तुलना में</tspan></text>
<rect x="400" y="150" width="267" height="52" rx="4" fill="#e0683c"/>
<text x="681" y="186" class="big">+508</text>
<text x="384" y="297" text-anchor="end" class="cat"><tspan x="384" dy="0">कीटोजेनिक, कम कार्ब वाली डाइट</tspan><tspan x="384" dy="17" class="sm">कम वसा, ज़्यादा कार्ब वाली डाइट</tspan><tspan x="384" dy="17" class="sm">(2021) की तुलना में</tspan></text>
<rect x="400" y="280" width="362" height="52" rx="4" fill="#d4af37"/>
<text x="776" y="316" class="big">+689</text>
<line x1="400" y1="126" x2="400" y2="362" stroke="#a0a0a0" stroke-width="1"/>
<text x="404" y="118" class="ax">रोज़ अतिरिक्त कैलोरी</text>
<text x="24" y="418" class="nt">Hall et al. 2019 (PMID 31105044), 20 वयस्क, हर डाइट 2 हफ़्ते, परोसे गए मैक्रोन्यूट्रिएंट बराबर।</text>
<text x="24" y="436" class="nt">Hall et al. 2021 (PMID 33479499), 20 वयस्क, हर डाइट 2 हफ़्ते, दोनों में खाना असीमित।</text>
<text x="876" y="488" text-anchor="end" class="nt" fill="#aa8a2e">NURVAN</text>
</svg>