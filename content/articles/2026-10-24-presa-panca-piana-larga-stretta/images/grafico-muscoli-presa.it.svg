<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t2 d2">
<title id="t2">Quali muscoli cambiano davvero cambiando presa in panca</title>
<desc id="d2">Differenze di attivazione elettromiografica passando alla presa larga in uomini allenati: bicipite +115,6% rispetto alla stretta e +44,9% rispetto alla media, tricipite −10,6% rispetto alla media, mentre pettorale sternale, pettorale clavicolare, deltoide anteriore e gran dorsale non mostrano differenze.</desc>
<rect width="800" height="560" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">Cosa cambia passando alla presa larga</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#a0a0a0">Attivazione muscolare a 6RM, uomini allenati · differenza percentuale</text>

<line x1="394" y1="100" x2="394" y2="480" stroke="#666" stroke-width="1.5"/>
<text x="394" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">0</text>

<text x="288" y="156" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Bicipite (vs stretta)</text>
<rect x="394" y="136" width="362" height="26" fill="#d4af37"/>
<text x="748" y="155" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0c0c0c">+115,6%</text>

<text x="288" y="200" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Bicipite (vs media)</text>
<rect x="394" y="180" width="141" height="26" fill="#d4af37"/>
<text x="545" y="199" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f3e5ab">+44,9%</text>

<text x="288" y="244" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Tricipite (vs media)</text>
<rect x="361" y="224" width="33" height="26" fill="#aa8a2e"/>
<text x="351" y="243" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f3e5ab">−10,6%</text>

<text x="288" y="288" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Pettorale, porzione sternale</text>
<circle cx="394" cy="280" r="6" fill="#5a5a5a"/>
<text x="412" y="285" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">nessuna differenza</text>

<text x="288" y="332" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Pettorale, porzione clavicolare</text>
<circle cx="394" cy="324" r="6" fill="#5a5a5a"/>
<text x="412" y="329" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">nessuna differenza</text>

<text x="288" y="376" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Deltoide anteriore</text>
<circle cx="394" cy="368" r="6" fill="#5a5a5a"/>
<text x="412" y="373" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">nessuna differenza</text>

<text x="288" y="420" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Gran dorsale</text>
<circle cx="394" cy="412" r="6" fill="#5a5a5a"/>
<text x="412" y="417" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">nessuna differenza</text>

<text x="288" y="464" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Deltoide medio e posteriore</text>
<circle cx="394" cy="456" r="6" fill="#5a5a5a"/>
<text x="412" y="461" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">nessuna differenza</text>

<text x="40" y="518" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">I due muscoli che la presa sposta davvero sono bicipite e tricipite. Il pettorale resta uguale con tutte e tre le prese.</text>
<text x="40" y="540" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">Fonte: Saeterbakken et al., 2021 (PMID 34198674), gruppo allenato, n = 15.</text>
</svg>
