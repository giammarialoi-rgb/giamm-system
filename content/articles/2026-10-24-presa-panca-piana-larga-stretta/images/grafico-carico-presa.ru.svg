<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t1-ru d1-ru">
<title id="t1-ru">Поднятый вес в жиме лёжа в зависимости от ширины хвата</title>
<desc id="d1-ru">Индекс веса 6ПМ при среднем хвате, равном 100: узкий хват 93, средний 100, широкий 100 у тренированных мужчин.</desc>
<rect width="800" height="480" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">Насколько меняется вес в жиме</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#a0a0a0">Вес 6ПМ, тренированные мужчины · индекс: средний хват = 100</text>

<line x1="150" y1="400" x2="760" y2="400" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="150" y1="130" x2="150" y2="400" stroke="#3a3a3a" stroke-width="1.5"/>

<line x1="150" y1="130" x2="760" y2="130" stroke="#222" stroke-width="1"/>
<line x1="150" y1="265" x2="760" y2="265" stroke="#222" stroke-width="1"/>
<text x="140" y="135" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">100</text>
<text x="140" y="270" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">50</text>
<text x="140" y="405" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">0</text>

<rect x="205" y="149" width="120" height="251" fill="#aa8a2e"/>
<text x="265" y="139" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e5ab">93</text>
<text x="265" y="428" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#f0f0f0">узкий</text>
<text x="265" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">(подмышки)</text>

<rect x="395" y="130" width="120" height="270" fill="#d4af37"/>
<text x="455" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e5ab">100</text>
<text x="455" y="428" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#f0f0f0">средний</text>

<rect x="585" y="130" width="120" height="270" fill="#d4af37"/>
<text x="645" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e5ab">100</text>
<text x="645" y="428" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#f0f0f0">широкий</text>
<text x="645" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">(81 см)</text>

<line x1="395" y1="100" x2="705" y2="100" stroke="#a0a0a0" stroke-width="1" stroke-dasharray="4 3"/>
<text x="550" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">нет разницы (p = 1,000)</text>

<text x="40" y="470" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">Рассчитано по опубликованным снижениям: узкий хват −7,0% к среднему и −7,1% к широкому. Источник: Saeterbakken et al., 2021 (PMID 34198674).</text>
</svg>
