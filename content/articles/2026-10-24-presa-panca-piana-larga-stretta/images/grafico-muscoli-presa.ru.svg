<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t2-ru d2-ru">
<title id="t2-ru">Какие мышцы действительно меняются при смене хвата</title>
<desc id="d2-ru">Различия активации при переходе на широкий хват у тренированных мужчин: бицепс +115,6% к узкому и +44,9% к среднему, трицепс −10,6% к среднему, тогда как грудинная и ключичная части грудной мышцы, передняя дельта и широчайшая не показывают различий.</desc>
<rect width="800" height="560" fill="#0c0c0c"/>
<text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f0f0f0">Что меняется при переходе на широкий хват</text>
<text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#a0a0a0">Активация мышц при 6ПМ, тренированные мужчины · разница в процентах</text>

<line x1="394" y1="100" x2="394" y2="480" stroke="#666" stroke-width="1.5"/>
<text x="394" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">0</text>

<text x="288" y="156" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Бицепс (к узкому)</text>
<rect x="394" y="136" width="362" height="26" fill="#d4af37"/>
<text x="748" y="155" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0c0c0c">+115,6%</text>

<text x="288" y="200" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Бицепс (к среднему)</text>
<rect x="394" y="180" width="141" height="26" fill="#d4af37"/>
<text x="545" y="199" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f3e5ab">+44,9%</text>

<text x="288" y="244" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Трицепс (к среднему)</text>
<rect x="361" y="224" width="33" height="26" fill="#aa8a2e"/>
<text x="351" y="243" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f3e5ab">−10,6%</text>

<text x="288" y="288" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Грудная, грудинная часть</text>
<circle cx="394" cy="280" r="6" fill="#5a5a5a"/>
<text x="412" y="285" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">нет разницы</text>

<text x="288" y="332" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Грудная, ключичная часть</text>
<circle cx="394" cy="324" r="6" fill="#5a5a5a"/>
<text x="412" y="329" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">нет разницы</text>

<text x="288" y="376" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Передняя дельта</text>
<circle cx="394" cy="368" r="6" fill="#5a5a5a"/>
<text x="412" y="373" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">нет разницы</text>

<text x="288" y="420" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Широчайшая мышца спины</text>
<circle cx="394" cy="412" r="6" fill="#5a5a5a"/>
<text x="412" y="417" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">нет разницы</text>

<text x="288" y="464" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#f0f0f0">Средняя и задняя дельта</text>
<circle cx="394" cy="456" r="6" fill="#5a5a5a"/>
<text x="412" y="461" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a0a0a0">нет разницы</text>

<text x="40" y="518" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">Хват реально сдвигает только две мышцы: бицепс и трицепс. Грудная остаётся одинаковой при всех трёх хватах.</text>
<text x="40" y="540" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a0a0a0">Источник: Saeterbakken et al., 2021 (PMID 34198674), тренированная группа, n = 15.</text>
</svg>
