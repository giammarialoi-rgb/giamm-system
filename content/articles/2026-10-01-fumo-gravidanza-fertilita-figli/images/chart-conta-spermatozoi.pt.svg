<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-label="Gráfico de barras: contagem total de espermatozoides 150 milhões nos não expostos e 119 milhões nos expostos ao fumo materno na gravidez (Ravnborg 2011, 3.486 homens dinamarqueses)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="150" fill="#0c0c0c"/>
<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">
<line x1="200.0" y1="14" x2="200.0" y2="110" stroke="#555"/>
<text x="200.0" y="128" text-anchor="middle">0</text>
<line x1="295.0" y1="14" x2="295.0" y2="110" stroke="#262626"/>
<text x="295.0" y="128" text-anchor="middle">40</text>
<line x1="390.0" y1="14" x2="390.0" y2="110" stroke="#262626"/>
