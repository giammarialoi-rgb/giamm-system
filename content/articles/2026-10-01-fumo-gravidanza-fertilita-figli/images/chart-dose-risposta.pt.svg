<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" role="img" aria-label="Gráfico de pontos: risco de oligozoospermia (odds ratio) 1,0 em filhos de não fumantes, 1,5 (IC 95% 0,9–2,8) com 1–10 cigarros por dia, 2,6 (IC 95% 1,2–5,8) com mais de 10 cigarros por dia (Jensen MS 2005)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="190" fill="#0c0c0c"/>
<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">
<line x1="200.0" y1="14" x2="200.0" y2="150" stroke="#262626"/>
<text x="200.0" y="168" text-anchor="middle">0</text>
<line x1="263.3" y1="14" x2="263.3" y2="150" stroke="#555"/>
<text x="263.3" y="168" text-anchor="middle">1</text>
<line x1="326.7" y1="14" x2="326.7" y2="150" stroke="#262626"/>
<text x="326.7" y="168" text-anchor="middle">2</text>
<line x1="390.0" y1="14" x2="390.0" y2="150" stroke="#262626"/>
<text x="390.0" y="168" text-anchor="middle">3</text>
<line x1="453.3" y1="14" x2="453.3" y2="150" stroke="#262626"/>
<text x="453.3" y="168" text-anchor="middle">4</text>
<line x1="516.6" y1="14" x2="516.6" y2="150" stroke="#262626"/>
<text x="516.6" y="168" text-anchor="middle">5</text>
<line x1="580.0" y1="14" x2="580.0" y2="150" stroke="#262626"/>
<text x="580.0" y="168" text-anchor="middle">6</text>
</g>
<g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="13" fill="#f0f0f0">
<text x="0" y="44">Não fumantes (ref.)</text>
<circle cx="263.3" cy="40" r="6" fill="#aa8a2e"/>
<text x="263.3" y="28" text-anchor="middle" font-size="12" fill="#a0a0a0">1 · referência</text>
<text x="0" y="88">1–10 cigarros/dia</text>
<line x1="257.0" y1="84" x2="377.3" y2="84" stroke="#aa8a2e" stroke-width="3" stroke-linecap="round"/>
<circle cx="295.0" cy="84" r="6" fill="#aa8a2e"/>
<text x="295.0" y="72" text-anchor="middle" font-size="12" fill="#a0a0a0">1,5 (0,9–2,8)</text>
<text x="0" y="132">Mais de 10/dia</text>
<line x1="276.0" y1="128" x2="567.3" y2="128" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
<circle cx="364.7" cy="128" r="6" fill="#d4af37"/>
<text x="364.7" y="116" text-anchor="middle" font-size="12" fill="#f3e5ab">2,6 (1,2–5,8)</text>
<text x="200" y="184" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">odds ratio (escala linear)</text>
</g></svg>
