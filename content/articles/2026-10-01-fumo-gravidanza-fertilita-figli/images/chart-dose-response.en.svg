<text x="200.0" y="168" text-anchor="middle">0</text>
<line x1="263.3" y1="14" x2="263.3" y2="150" stroke="#555"/>
<text x="263.3" y="168" text-anchor="middle">1</text>
<line x1="326.7" y1="14" x2="326.7" y2="150" stroke="#262626"/>
