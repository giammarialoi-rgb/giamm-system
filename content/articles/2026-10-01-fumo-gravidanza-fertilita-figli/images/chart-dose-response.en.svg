<line x1="276.0" y1="128" x2="567.3" y2="128" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
<circle cx="364.7" cy="128" r="6" fill="#d4af37"/>
<text x="364.7" y="116" text-anchor="middle" font-size="12" fill="#f3e5ab">2.6 (1.2–5.8)</text>
<text x="200" y="184" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a0a0a0">odds ratio (linear scale)</text>
</g></svg>
