<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" role="img" aria-label="Dot chart: odds ratio for oligozoospermia 1.0 for sons of non-smokers, 1.5 (95% CI 0.9–2.8) for 1–10 cigarettes a day, 2.6 (95% CI 1.2–5.8) for more than 10 cigarettes a day (Jensen MS 2005)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
