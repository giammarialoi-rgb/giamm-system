<line x1="453.3" y1="14" x2="453.3" y2="150" stroke="#262626"/>
<text x="453.3" y="168" text-anchor="middle">4</text>
<line x1="516.6" y1="14" x2="516.6" y2="150" stroke="#262626"/>
<text x="516.6" y="168" text-anchor="middle">5</text>
<line x1="580.0" y1="14" x2="580.0" y2="150" stroke="#262626"/>
