services:
  - type: web
    name: coach-api-gemini
    runtime: node
    region: oregon
    buildCommand: npm install && node generate_science_programs_10k.mjs && node generate_bundles.mjs && node build_master25.mjs
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: coach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_REDIRECT_URI
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
databases:
  - name: coach-db
    databaseName: coach
    user: coach
    region: oregon
    plan: free
