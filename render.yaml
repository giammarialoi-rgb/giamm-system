services:
  - type: web
    name: coach-api-gemini
    runtime: node
    region: oregon
    buildCommand: npm install && node build_master25.mjs
    startCommand: npm start
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: RATE_LIMIT_STORE
        value: memory
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: coach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Account emails (verification, password reset): Resend API key and a
      # sender on a domain verified in Resend, e.g. "NURVAN <account@dominio>".
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_REDIRECT_URI
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      # Optional WebRTC TURN for videocalls behind mobile/NAT (set in Render dashboard).
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # Web Push (PWA). Generate VAPID keys locally; set in Render dashboard.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:noreply@nurvan.app
databases:
  - name: coach-db
    databaseName: coach
    user: coach
    region: oregon
    plan: free
