<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nurvan Admin</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
    --accent: #8a6d1d; --accent-bg: #f4ecd6; --bad: #a33b2b; --ok: #2f6b3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { overflow-x: hidden; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .who { font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; color: var(--text); }
  nav button[aria-current="page"] { background: var(--accent-bg); border-color: #e0cf9c; color: var(--accent); font-weight: 600; }
  main { padding: 16px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  .tbl { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { background: #fafaf8; font-weight: 600; color: var(--muted); position: sticky; top: 0; }
  td.wrap { white-space: normal; min-width: 180px; }
  tr.sub td { background: #fcfbf7; white-space: normal; }
  input, select, button.btn { font: inherit; padding: 6px 8px; border: 1px solid #cfcdc5; border-radius: 6px; background: #fff; color: var(--text); }
  input[type=number] { width: 80px; }
  button.btn { cursor: pointer; background: #fff; }
  button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.nowrap { flex-wrap: nowrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .msg { padding: 8px 10px; border-radius: 6px; margin: 8px 0; font-size: 13px; }
  .msg.bad { background: #f8e7e3; color: var(--bad); }
  .msg.ok { background: #e6f0e6; color: var(--ok); }
  .msg.warn { background: var(--accent-bg); color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .n { font-size: 22px; font-weight: 700; }
  .card .l { font-size: 12px; color: var(--muted); }
  .login { max-width: 360px; margin: 48px auto; }
  .login label { display: block; margin: 10px 0 4px; font-size: 13px; }
  .login input { width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <section id="login" class="login panel" hidden>
    <h2>Nurvan Admin</h2>
    <p class="muted">Accesso riservato. Ti mandiamo un codice a 6 cifre per email.</p>
    <form id="login-email">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <div class="row" style="margin-top:10px;"><button class="btn primary" type="submit">Invia il codice</button></div>
    </form>
    <form id="login-code" hidden>
      <label for="code">Codice</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <div class="row" style="margin-top:10px;"><button class="btn primary" type="submit">Entra</button><button class="btn" type="button" id="login-back">Cambia email</button></div>
    </form>
    <div id="login-msg"></div>
  </section>

  <div id="app" hidden>
    <header>
      <h1>Nurvan Admin</h1>
      <div class="row"><span class="who" id="who"></span><button class="btn" id="logout" type="button">Esci</button></div>
    </header>
    <nav id="tabs">
      <button type="button" data-tab="accounts">Account</button>
      <button type="button" data-tab="coaches">Coach</button>
      <button type="button" data-tab="metrics">Numeri</button>
      <button type="button" data-tab="catalog">Catalogo</button>
      <button type="button" data-tab="errors">Errori</button>
      <button type="button" data-tab="planlog">Log piani</button>
    </nav>
    <main id="view"></main>
  </div>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
