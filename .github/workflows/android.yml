# Android build for Google Play on a GitHub machine: builds the web app, the
# signed App Bundle (.aab) and uploads it to the Play internal testing track.
# Started by hand from the Actions tab, or together with iOS by pushing a
# tag v* (git tag v1.5.35 && git push origin v1.5.35).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64     the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           the key alias inside it
#   ANDROID_KEY_PASSWORD        the key password
#   PLAY_SERVICE_ACCOUNT_JSON   Play Console service account (optional: without
#                               it the .aab is only attached to the run)
name: Android Play

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0" || sdkmanager "platforms;android-37"

      - name: Upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "Manca il secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease -PversionCode=$((1000 + ${{ github.run_number }}))

      - uses: actions/upload-artifact@v4
        with:
          name: nurvan-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload to Play (internal testing)
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nurvan.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
